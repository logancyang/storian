<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>Storian Storyboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #000000;
  --ink: #FFFFFF;
  --paper-2: #FFD147;
  --ink-soft: #5765FF;
  --grid: rgba(255,255,255,0.10);
  --ink-faint: rgba(255,255,255,0.18);
  --muted: rgba(255,255,255,0.62);
  --card: #0b0b0d;
  --serif: "Newsreader", Georgia, serif;
  --sans: "Hanken Grotesk", system-ui, sans-serif;
  --mono: "DM Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--sans);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 32px 32px; background-attachment: fixed;
}
a { color: inherit; }
.micro { font: 600 12px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.mono { font-family: var(--mono); letter-spacing: .04em; }
.wrap { max-width: 1440px; margin: 0 auto; padding: 0 32px; }

/* top bar */
header.top { position: sticky; top: 0; z-index: 20; background: rgba(0,0,0,.88); backdrop-filter: blur(8px); border-bottom: 1.5px solid var(--ink); }
header.top .wrap { display: flex; align-items: center; gap: 24px; height: 56px; }
.brand { font: 500 14px var(--mono); letter-spacing: .2em; }
.brand b { color: var(--paper-2); font-weight: 500; }
nav { display: flex; gap: 4px; margin-left: 8px; }
nav button { background: none; border: 0; color: var(--muted); font: 600 12px var(--sans); letter-spacing: .14em; text-transform: uppercase; padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; }
nav button.on { color: var(--ink); border-color: var(--paper-2); }
nav .sm { display: none; }
.spacer { flex: 1; }
.live { font: 12px var(--mono); color: var(--muted); display: flex; align-items: center; gap: 8px; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-soft); display: inline-block; }
.live.flash i { background: var(--paper-2); }

/* hero */
.hero { padding: 56px 0 32px; border-bottom: 1.5px solid var(--ink); }
.hero h1 { font: 400 clamp(48px, 7vw, 104px)/0.92 var(--serif); letter-spacing: -0.01em; margin: 14px 0 18px; }
.hero .logline { font: italic 400 clamp(20px, 2vw, 28px)/1.25 var(--serif); color: var(--muted); max-width: 900px; margin: 0 0 40px; }
.tmm { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1.5px solid var(--ink); }
.tmm > div { padding: 20px 24px 24px 0; border-right: 1px solid var(--ink-faint); }
.tmm > div + div { padding-left: 24px; }
.tmm > div:last-child { border-right: 0; }
.tmm .v { font: 400 clamp(22px, 2.2vw, 32px)/1.15 var(--serif); margin-top: 10px; }
.idea { display: grid; grid-template-columns: 220px 1fr; gap: 24px; border-top: 1px solid var(--ink-faint); padding: 28px 0; }
.idea p { font: 400 clamp(18px, 1.6vw, 22px)/1.55 var(--serif); margin: 0; max-width: 980px; }
.notes { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; border-top: 1px solid var(--ink-faint); padding: 20px 0 0; color: var(--muted); }
.notes p { margin: 8px 0 0; }
.statbar { display: flex; flex-wrap: wrap; gap: 0; margin-top: 32px; border: 1.5px solid var(--ink); }
.statbar > div { padding: 14px 22px; border-right: 1px solid var(--ink-faint); }
.statbar .n { font: 400 30px/1 var(--serif); }
.statbar .l { font: 11px var(--mono); color: var(--muted); letter-spacing: .08em; margin-top: 6px; text-transform: uppercase; }
.statbar .play { margin-left: auto; border-right: 0; display: flex; align-items: center; }
.btn { background: var(--paper-2); color: #000; border: 0; font: 600 13px var(--sans); letter-spacing: .14em; text-transform: uppercase; padding: 14px 22px; cursor: pointer; }
.btn.ghost { background: none; color: var(--ink); border: 1.5px solid var(--ink); }

/* act timeline */
.timeline { display: flex; height: 40px; margin: 28px 0 0; border: 1.5px solid var(--ink); }
.timeline a { display: flex; align-items: center; padding: 0 10px; text-decoration: none; font: 11px var(--mono); white-space: nowrap; overflow: hidden; border-right: 1px solid var(--ink-faint); }
.timeline a:nth-child(odd) { background: rgba(87,101,255,.22); }
.timeline a:hover { background: var(--ink-soft); }

/* acts */
.act { padding: 48px 0 8px; }
.act-head { display: grid; grid-template-columns: 120px 1fr auto; gap: 24px; align-items: end; border-bottom: 1.5px solid var(--ink); padding-bottom: 14px; }
.act-num { font: 400 72px/0.8 var(--serif); color: var(--paper-2); }
.act-head h2 { font: 400 40px/1 var(--serif); margin: 0 0 8px; }
.act-head .purpose { color: var(--muted); max-width: 820px; }
.act-head .range { font: 12px var(--mono); color: var(--muted); text-align: right; line-height: 1.7; }
details.vo { margin: 14px 0 0 144px; border-left: 2px solid var(--paper-2); padding: 4px 0 4px 16px; }
details.vo summary { cursor: pointer; font: 600 11px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--paper-2); }
details.vo p { font: italic 400 19px/1.55 var(--serif); margin: 10px 0 0; white-space: pre-wrap; max-width: 900px; }

.shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 18px; margin-top: 22px; }
.shot { background: var(--card); border: 1px solid var(--ink-faint); cursor: pointer; display: flex; flex-direction: column; transition: border-color .15s; }
.shot:hover, .shot.sel { border-color: var(--paper-2); }
.thumb { position: relative; aspect-ratio: 16/9; background: #111; overflow: hidden; }
.thumb img, .thumb video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.thumb video { opacity: 0; transition: opacity .15s; }
.thumb.playing video { opacity: 1; }
.tag { position: absolute; font: 500 11px var(--mono); padding: 3px 7px; background: rgba(0,0,0,.78); letter-spacing: .06em; }
.tag.id { top: 8px; left: 8px; }
.tag.role { top: 8px; right: 8px; text-transform: uppercase; }
.tag.role.vo { background: var(--paper-2); color: #000; }
.tag.role.broll, .tag.role.natsound, .tag.role.hook, .tag.role.hold, .tag.role.title { background: var(--ink-soft); color: #fff; }
.tag.dur { bottom: 8px; right: 8px; }
.tag.cut { bottom: 8px; left: 8px; color: var(--paper-2); }
.strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: #000; }
.strip img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; opacity: .85; }
.meta { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.meta .row1 { display: flex; justify-content: space-between; font: 12px var(--mono); }
.meta .row1 b { font-weight: 500; color: var(--ink); }
.meta .row1 span { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font: 11px var(--mono); padding: 2px 7px; border: 1px solid var(--ink-faint); color: var(--muted); }
.chip.k { border-color: var(--ink-soft); color: #c9ceff; }
.voline { font: italic 400 17px/1.35 var(--serif); color: var(--paper-2); }
.voline.none { font: 11px var(--mono); color: var(--muted); font-style: normal; letter-spacing: .08em; text-transform: uppercase; }
.why { font-size: 13px; color: var(--muted); line-height: 1.45; }
.summary { font-size: 13px; }

/* drawer */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100vw); background: #050505; border-left: 1.5px solid var(--ink); z-index: 40; transform: translateX(100%); transition: transform .2s; overflow-y: auto; }
.drawer.open { transform: none; }
.drawer .in { padding: 24px 28px 48px; }
.drawer video, .drawer .still { width: 100%; aspect-ratio: 16/9; background: #111; display: block; object-fit: cover; }
.drawer h3 { font: 400 34px/1.05 var(--serif); margin: 18px 0 6px; }
.drawer .close { position: sticky; top: 0; float: right; z-index: 2; }
.kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 16px; margin: 18px 0; font-size: 14px; }
.kv dt { font: 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; padding-top: 3px; }
.kv dd { margin: 0; }
.moments { border-top: 1px solid var(--ink-faint); margin-top: 8px; }
.moments div { padding: 8px 0; border-bottom: 1px solid var(--ink-faint); font-size: 14px; }
.moments .mono { color: var(--paper-2); margin-right: 10px; }
.sheet { width: 100%; margin-top: 16px; border: 1px solid var(--ink-faint); }
.copy { cursor: pointer; border-bottom: 1px dashed var(--muted); }

/* animatic */
.animatic { position: fixed; inset: 0; background: #000; z-index: 60; display: none; flex-direction: column; }
.animatic.open { display: flex; }
.animatic .stage { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; }
.animatic video, .animatic img { max-width: 100%; max-height: 100%; position: absolute; inset: 0; margin: auto; width: 100%; height: 100%; object-fit: contain; }
.animatic .sub { position: absolute; left: 0; right: 0; bottom: 64px; text-align: center; font: italic 400 clamp(20px, 2.4vw, 34px)/1.3 var(--serif); color: var(--paper-2); text-shadow: 0 2px 12px #000; padding: 0 10%; }
.animatic .hud { position: absolute; top: 18px; left: 24px; right: 24px; display: flex; justify-content: space-between; font: 12px var(--mono); color: var(--muted); }
.animatic .bar { height: 4px; background: var(--ink-faint); }
.animatic .bar i { display: block; height: 100%; background: var(--paper-2); width: 0; }
.animatic .keys { font: 11px var(--mono); color: var(--muted); text-align: center; padding: 10px; }

/* library + treatments */
.toolbar { display: flex; gap: 12px; align-items: center; padding: 28px 0 18px; flex-wrap: wrap; }
.toolbar input, .toolbar select { background: #000; color: var(--ink); border: 1.5px solid var(--ink); font: 14px var(--mono); padding: 10px 12px; }
.toolbar input { flex: 1; min-width: 220px; }
.lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(380px, 100%), 1fr)); gap: 18px; padding-bottom: 60px; }
.lib .shot img.sh { width: 100%; display: block; }
.used { color: var(--paper-2); }
.treat { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(360px, 100%), 1fr)); gap: 18px; padding: 24px 0 60px; }
.treat > div { border: 1.5px solid var(--ink-faint); padding: 24px; background: var(--card); }
.treat > div.chosen { border-color: var(--paper-2); }
.treat h3 { font: 400 36px/1 var(--serif); margin: 10px 0; }
.treat ol { padding-left: 18px; color: var(--muted); }
.page-title { font: 400 56px/1 var(--serif); margin: 48px 0 8px; }
.lede { color: var(--muted); max-width: 900px; font-size: 17px; }
.issues li { margin: 6px 0; font: 13px var(--mono); }
.issues .err { color: #ff7b7b; }
.empty { padding: 80px 0; font: 400 28px/1.3 var(--serif); color: var(--muted); }
footer { border-top: 1.5px solid var(--ink); margin-top: 60px; padding: 18px 0 40px; font: 12px var(--mono); color: var(--muted); }


/* coverage review */
.cov { padding: 44px 0 40px; border-bottom: 1.5px solid var(--ink); }
.cov-top { display: grid; grid-template-columns: 1fr auto; gap: 32px; align-items: end; }
.cov h2 { font: 400 clamp(36px, 4.4vw, 60px)/0.95 var(--serif); margin: 12px 0 14px; }
.cov h2 em { color: var(--paper-2); font-style: italic; }
.cov .sum { font: 400 18px/1.55 var(--serif); max-width: 860px; margin: 0; color: rgba(255,255,255,.86); }
.cov-stats { display: flex; border: 1.5px solid var(--ink); }
.cov-stats > div { padding: 12px 18px; border-right: 1px solid var(--ink-faint); min-width: 96px; }
.cov-stats > div:last-child { border-right: 0; }
.cov-stats .n { font: 400 30px/1 var(--serif); }
.cov-stats .n.y { color: var(--paper-2); }
.cov-stats .l { font: 11px var(--mono); color: var(--muted); letter-spacing: .08em; margin-top: 6px; text-transform: uppercase; }
.covt-wrap { margin-top: 28px; overflow-x: auto; border: 1.5px solid var(--ink); }
table.covt { width: 100%; border-collapse: collapse; min-width: 980px; }
.covt th { font: 500 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 8px 4px; text-align: center; border-bottom: 1px solid var(--ink-faint); white-space: nowrap; }
.covt th.grp { color: var(--ink); border-bottom: 1px solid var(--ink-faint); border-left: 1px solid var(--ink-faint); }
.covt th.l, .covt td.l { text-align: left; padding-left: 14px; }
.covt td { padding: 9px 4px; border-bottom: 1px solid var(--ink-faint); text-align: center; vertical-align: middle; }
.covt td.g0 { border-left: 1px solid var(--ink-faint); }
.covt tr.row { cursor: pointer; }
.covt tr.row:hover td { background: rgba(87,101,255,.10); }
.covt tr.row.open td { background: rgba(255,209,71,.06); }
.covt .nm { font: 400 19px/1.15 var(--serif); }
.covt .sub { font: 11px var(--mono); color: var(--muted); margin-top: 3px; }
.cell { display: inline-flex; width: 26px; height: 22px; align-items: center; justify-content: center; font: 500 11px var(--mono); }
.cell.have { background: var(--ink-soft); color: #fff; }
.cell.gap { border: 1.5px solid var(--paper-2); color: var(--paper-2); font-size: 14px; }
.cell.none { color: var(--ink-faint); }
.pri { display: inline-block; font: 600 11px var(--mono); padding: 3px 7px; letter-spacing: .06em; }
.pri.p1 { background: var(--paper-2); color: #000; }
.pri.p2 { border: 1.5px solid var(--paper-2); color: var(--paper-2); }
.pri.p3, .pri.ok { border: 1px solid var(--ink-faint); color: var(--muted); }
.needchips { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-start; }
.needchips .chip { color: var(--paper-2); border-color: rgba(255,209,71,.5); }
.imp { font: 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.imp.core { color: var(--paper-2); }
tr.detail td { padding: 0; background: #060606; }
.covd { display: grid; grid-template-columns: minmax(280px, 420px) 1fr; gap: 28px; padding: 20px 18px 26px; text-align: left; }
.covd .thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
.covd .thumbs div { position: relative; cursor: pointer; }
.covd .thumbs img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
.covd .thumbs span { position: absolute; left: 4px; bottom: 4px; font: 10px var(--mono); background: rgba(0,0,0,.75); padding: 1px 5px; }
.covd .verdict { font: italic 400 18px/1.45 var(--serif); margin: 0 0 14px; }
.needs { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink-faint); }
.needs li { display: grid; grid-template-columns: 22px 44px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--ink-faint); align-items: start; }
.needs li.got .what { text-decoration: line-through; color: var(--muted); }
.needs input { accent-color: var(--paper-2); width: 16px; height: 16px; margin-top: 3px; }
.needs .what { font-size: 15px; }
.needs .spec { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.needs .wy { font-size: 13px; color: var(--muted); margin-top: 5px; }
.chip.where { border-color: var(--ink-soft); color: #c9ceff; }
.subj { font: 10px var(--mono); padding: 2px 6px; letter-spacing: .06em; text-transform: uppercase; }
.subj.none { background: var(--ink-soft); color: #fff; }
.subj.unrecognizable { border: 1px solid var(--ink-soft); color: #c9ceff; }
.subj.talent { border: 1px solid var(--paper-2); color: var(--paper-2); }
.fallback { font-size: 13px; margin-top: 6px; padding-left: 10px; border-left: 2px solid var(--ink-soft); color: #c9ceff; }
.match { font: 12px/1.6 var(--mono); color: var(--muted); margin-top: 10px; }
.match b { color: var(--ink); font-weight: 500; }
.cov-more { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.cov-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 32px; }
.cov-cols h3 { font: 400 26px/1 var(--serif); margin: 10px 0 12px; }
.film li { grid-template-columns: 44px 1fr; }
.boardhead { padding: 36px 0 0; }
.boardhead .statbar { margin-top: 14px; }

/* music */
.cues { display: flex; flex-direction: column; gap: 18px; margin: 18px 0 40px; }
.cue { border: 1.5px solid var(--ink-faint); background: var(--card); }
.cue-head { display: grid; grid-template-columns: 70px 1fr auto; gap: 18px; padding: 18px 20px 14px; border-bottom: 1px solid var(--ink-faint); align-items: end; }
.cue-head .num { font: 400 44px/0.8 var(--serif); color: var(--paper-2); }
.cue-head h3 { font: 400 30px/1 var(--serif); margin: 0 0 6px; }
.cue-head .range { font: 12px var(--mono); color: var(--muted); text-align: right; line-height: 1.7; }
.cue-body { padding: 12px 20px 16px; }
.trk { display: grid; grid-template-columns: 44px minmax(0, 1fr) 160px; gap: 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--ink-faint); }
.trk:last-child { border-bottom: 0; }
.trk .t { font: 400 19px/1.2 var(--serif); }
.trk .a { font: 12px var(--mono); color: var(--muted); margin-top: 3px; }
.trk .wy { font-size: 13px; color: var(--muted); margin-top: 5px; }
.trk.chosen .t::before { content: "● "; color: var(--paper-2); font-size: 14px; vertical-align: 2px; }
.pbtn { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--ink); background: none; color: var(--ink); cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; }
.pbtn.on { background: var(--paper-2); border-color: var(--paper-2); color: #000; }
.pbtn:disabled { opacity: .3; cursor: default; }
svg.wave { width: 100%; height: 34px; display: block; cursor: pointer; }
svg.wave path { fill: var(--ink-faint); }
svg.wave path.prog { fill: var(--paper-2); }
.lic { font: 10px var(--mono); padding: 2px 6px; letter-spacing: .06em; text-transform: uppercase; }
.lic.ok { border: 1px solid var(--ink-soft); color: #c9ceff; }
.lic.no { border: 1px solid #ff7b7b; color: #ff7b7b; }
.refs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap: 18px; margin: 18px 0 40px; }
.ref { border: 1.5px solid var(--ink-faint); background: var(--card); padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.ref h3 { font: 400 24px/1.1 var(--serif); margin: 0; }
.credits { font: 12px/1.7 var(--mono); color: var(--muted); border: 1px solid var(--ink-faint); padding: 14px 16px; white-space: pre-wrap; margin: 10px 0 60px; }
.section-h { font: 400 34px/1 var(--serif); margin: 44px 0 4px; }
/* player bar */
.player { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: rgba(0,0,0,.94); border-top: 1.5px solid var(--ink); backdrop-filter: blur(8px); display: none; }
.player.show { display: block; }
.player .wrap { display: grid; grid-template-columns: 44px minmax(0, 260px) 1fr auto auto; gap: 16px; align-items: center; height: 68px; }
.player .t { font: 400 17px/1.15 var(--serif); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player .a { font: 11px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player input[type=range] { width: 100%; accent-color: var(--paper-2); }
.player .tm { font: 12px var(--mono); color: var(--muted); }
body.playing-bar { padding-bottom: 68px; }
.animatic .score { position: absolute; top: 44px; right: 24px; font: 12px var(--mono); background: none; border: 1px solid var(--ink-faint); color: var(--muted); padding: 5px 9px; cursor: pointer; }
.animatic .score.on { color: var(--paper-2); border-color: var(--paper-2); }
.animatic .aclose { position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 12px; z-index: 2; width: 40px; height: 40px; background: rgba(0,0,0,.6); border: 1px solid var(--ink-faint); color: var(--ink); font-size: 16px; cursor: pointer; }
.animatic .hud { left: 64px; }
.drow { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }

/* shot list */
details.note summary { cursor: pointer; list-style: none; color: var(--paper-2); padding: 4px 0; }
details.note summary::-webkit-details-marker { display: none; }
.prog { height: 6px; background: var(--ink-faint); margin-top: 18px; }
.prog i { display: block; height: 100%; background: var(--paper-2); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0 4px; }
.toggle { background: none; border: 1.5px solid var(--ink-faint); color: var(--muted); font: 600 12px var(--sans); letter-spacing: .08em; text-transform: uppercase; padding: 11px 14px; cursor: pointer; }
.toggle.on { border-color: var(--paper-2); color: var(--paper-2); }
.scns { display: flex; flex-direction: column; gap: 12px; margin: 16px 0 40px; }
details.scn { border: 1.5px solid var(--ink-faint); background: var(--card); }
details.scn[open] { border-color: var(--ink); }
details.scn > summary { list-style: none; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 16px; cursor: pointer; }
details.scn > summary::-webkit-details-marker { display: none; }
.scn .nm { font: 400 21px/1.15 var(--serif); }
.scn .sub { font: 11px var(--mono); color: var(--muted); margin-top: 4px; }
.scn .cnt { font: 11px var(--mono); color: var(--muted); text-align: right; white-space: nowrap; }
.scn .cnt b { display: block; color: var(--ink); font: 400 22px/1 var(--serif); margin-bottom: 2px; }
.scn.done .nm { color: var(--muted); text-decoration: line-through; }
.scn .covd { padding-top: 4px; }

@media (hover: none) { .shot:hover { border-color: var(--ink-faint); } }
@media (max-width: 820px) {
  * { -webkit-tap-highlight-color: transparent; }
  body { -webkit-text-size-adjust: 100%; padding-bottom: calc(56px + env(safe-area-inset-bottom)); }
  .wrap { padding: 0 16px; }
  header.top { padding-top: env(safe-area-inset-top); backdrop-filter: none; background: #000; }  /* a backdrop-filter would trap the fixed tab bar inside the header */
  header.top .wrap { height: 48px; gap: 12px; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; margin: 0; z-index: 25; display: grid; grid-template-columns: repeat(6, 1fr); gap: 0;
    background: rgba(0,0,0,.94); backdrop-filter: blur(8px); border-top: 1.5px solid var(--ink); padding-bottom: env(safe-area-inset-bottom); }
  nav button { height: 56px; padding: 0; font-size: 10px; letter-spacing: .06em; border-bottom: 0; border-top: 2px solid transparent; }
  nav button.on { border-top-color: var(--paper-2); }
  nav .lg { display: none; } nav .sm { display: inline; }
  .live:not(.hosted) span { display: none; }
  .live span { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player { bottom: calc(56px + env(safe-area-inset-bottom)); }
  .player .wrap { grid-template-columns: 44px minmax(0, 1fr) auto; height: 64px; }
  .player .wrap > :nth-child(3), .player .wrap > :nth-child(4) { display: none; }
  body.playing-bar { padding-bottom: calc(120px + env(safe-area-inset-bottom)); }
  .drawer .in { padding: calc(14px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom)); }
  .drawer h3 { font-size: 28px; }
  .kv { grid-template-columns: 88px minmax(0, 1fr); gap: 6px 12px; }
  .hero { padding: 28px 0 24px; }
  .hero .logline { margin-bottom: 24px; }
  .tmm, .notes, .idea { grid-template-columns: 1fr; }
  .tmm > div, .tmm > div + div { padding: 16px 0; border-right: 0; border-bottom: 1px solid var(--ink-faint); }
  .idea { gap: 10px; padding: 20px 0; }
  .statbar > div { flex: 1 1 33%; padding: 12px 14px; }
  .statbar .n { font-size: 24px; }
  .statbar .play { flex-basis: 100%; padding: 0; border-top: 1px solid var(--ink-faint); }
  .statbar .play .btn { width: 100%; }
  .timeline a { padding: 0 4px; font-size: 10px; }
  .act { padding-top: 36px; }
  .act-head { grid-template-columns: 1fr; gap: 8px; }
  .act-num { font-size: 52px; }
  .act-head h2 { font-size: 30px; }
  .act-head .range { text-align: left; }
  details.vo { margin-left: 0; }
  .page-title { font-size: 40px; margin-top: 28px; }
  .section-h { font-size: 28px; }
  .cov { padding: 32px 0 28px; }
  .cov-top, .cov-cols, .covd { grid-template-columns: 1fr; }
  .cov-stats { flex-wrap: wrap; }
  .cov-stats > div { flex: 1 1 33%; min-width: 0; padding: 10px 12px; }
  .cov .desk, .cov .cov-cols { display: none; }
  .cov-more .btn { flex: 1 1 100%; }
  .covd { gap: 16px; padding: 0 14px 16px; }
  .needs li { grid-template-columns: 30px 40px minmax(0, 1fr); padding: 12px 0; }
  .needs input { width: 22px; height: 22px; margin-top: 0; }
  details.scn > summary { padding: 14px; gap: 12px; }
  .filters .toggle { flex: 1 1 auto; }
  .trk { grid-template-columns: 44px minmax(0, 1fr); }
  .trk svg.wave { grid-column: 2; }
  .cue-head { grid-template-columns: 1fr; gap: 6px; }
  .cue-head .range { text-align: left; }
  .lib { grid-template-columns: 1fr; }
  .toolbar input { min-width: 0; flex-basis: 100%; }
  .toolbar select { flex: 1 1 0; min-width: 0; }
  .animatic .keys { display: none; }
  .animatic #hudR { display: none; }
  .animatic .sub { bottom: 24px; font-size: 19px; padding: 0 6%; }
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand">STORIAN<b>.</b></div>
  <nav id="nav">
    <button data-tab="board" class="on"><span class="lg">Storyboard</span><span class="sm">Board</span></button>
    <button data-tab="shoot"><span class="lg">Shot list</span><span class="sm">Shoot</span></button>
    <button data-tab="music">Music</button>
    <button data-tab="lib">Library</button>
    <button data-tab="treat"><span class="lg">Treatments</span><span class="sm">Ideas</span></button>
    <button data-tab="checks">Checks</button>
  </nav>
  <div class="spacer"></div>
  <div class="live" id="live"><i></i><span>live · edits from your agent appear here</span></div>
</div></header>

<main id="app"><div class="wrap empty">Loading…</div></main>

<div class="player" id="player"><div class="wrap">
  <button class="pbtn" id="pPlay" onclick="togglePlay()">▶</button>
  <div><div class="t" id="pTitle"></div><div class="a" id="pArtist"></div></div>
  <input type="range" id="pSeek" min="0" max="1000" value="0" oninput="AUDIO.duration && (AUDIO.currentTime = this.value / 1000 * AUDIO.duration)">
  <span class="tm" id="pTime">0:00</span>
  <button class="btn ghost" style="padding:8px 12px" onclick="stopPlay()">✕</button>
</div></div>

<aside class="drawer" id="drawer"><div class="in" id="drawerIn"></div></aside>

<div class="animatic" id="anim">
  <div class="stage" id="stage" onclick="tapStage(event)">
    <video id="animV" playsinline style="display:none"></video><img id="animI" alt="" style="display:none">
    <button class="aclose" onclick="event.stopPropagation();closeAnim()" title="close">✕</button>
    <div class="hud"><span id="hudL"></span><span id="hudR"></span></div>
    <div class="sub" id="sub"></div>
    <button class="score" id="scoreBtn" onclick="event.stopPropagation();toggleScore()"></button>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div class="keys">space pause · ← → shot · esc close · tap the edges to skip</div>
</div>

<script>
const TABS = ["board", "shoot", "music", "lib", "treat", "checks"];
let D = null, TAB = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "board", VERSION = 0;
const HOVER = matchMedia("(hover: hover)").matches;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = v => typeof v === "number" ? v : String(v).split(":").reduce((a, p) => a * 60 + parseFloat(p), 0);
const fmt = t => { t = Math.max(0, t); const m = Math.floor(t / 60), s = t - m * 60; return `${String(m).padStart(2, "0")}:${s.toFixed(1).padStart(4, "0")}`; };
const fmtLong = t => { const m = Math.floor(t / 60), s = Math.round(t - m * 60); return `${m}:${String(s).padStart(2, "0")}`; };

function frameUrl(clip, t) {
  const f = D.frames[clip];
  if (!f || !f.t.length) return "";
  let best = f.t[0];
  for (const x of f.t) { if (x <= t + 0.5) best = x; else break; }
  return `/media/frames/${clip}/t${best.toFixed(3).padStart(9, "0")}.jpg`;
}
function previewUrl(s) {
  const name = `${s.clip}_${num(s.in).toFixed(2)}_${num(s.out).toFixed(2)}.mp4`;
  return D.previews.includes(name) ? `/media/previews/${name}` : null;
}
function allShots() {
  const out = []; let t = 0, n = 0;
  for (const [ai, a] of (D.sequence?.acts || []).entries())
    for (const s of a.shots) {
      const dur = num(s.out) - num(s.in);
      out.push({ ...s, act: a, ai, idx: n++, at: t, dur }); t += dur;
    }
  return out;
}

async function load() {
  D = await (await fetch("/api/project")).json();
  render();
  liveLabel();
}
// hosted (storian publish): a snapshot that changes only when the laptop publishes again
function liveLabel(offline) {
  if (!D.hosted) return;
  $("#live").classList.add("hosted");
  const h = (Date.now() - Date.parse(D.hosted.published)) / 3.6e6;
  const ago = h < 1 ? `${Math.max(1, Math.round(h * 60))} min ago` : h < 48 ? `${Math.round(h)} h ago` : `${Math.round(h / 24)} days ago`;
  $("#live span").textContent = offline ? `offline · saved copy from ${ago}` : `published ${ago}`;
}
async function poll() {
  try {
    const { v } = await (await fetch("/api/version")).json();
    if (VERSION && v !== VERSION) {
      const y = scrollY; await load(); scrollTo(0, y);
      $("#live").classList.add("flash"); setTimeout(() => $("#live").classList.remove("flash"), 1200);
    }
    VERSION = v;
    liveLabel();
  } catch (e) { D && liveLabel(true); }
  setTimeout(poll, D?.hosted ? 60000 : 2000);
}

function render() {
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === TAB));
  const app = $("#app");
  if (TAB === "treat") app.innerHTML = renderTreatments();
  else if (TAB === "lib") { app.innerHTML = renderLibraryShell(); renderLibrary(); }
  else if (TAB === "checks") app.innerHTML = renderChecks();
  else if (TAB === "music") app.innerHTML = renderMusic();
  else if (TAB === "shoot") app.innerHTML = renderShoot();
  else app.innerHTML = renderBoard();
  bindShots();
  syncPlayButtons();
}

/* ---------------- storyboard */
function renderBoard() {
  const S = D.sequence;
  if (!S) {
    const st = D.story;
    return `<div class="wrap empty">No sequence yet.<br><span class="lede">${st ? "Treatments are ready — pick one in the Treatments tab and tell your agent." : "Ask your agent to run the storian pipeline (storian status shows the next step)."}</span></div><div class="wrap">${renderCoverage()}</div>`;
  }
  const shots = allShots();
  const total = shots.reduce((a, s) => a + s.dur, 0);
  const vo = shots.filter(s => s.role === "vo" || s.vo_line).reduce((a, s) => a + s.dur, 0);
  const nClips = Object.keys(D.clips).length;
  const used = new Set(shots.map(s => s.clip)).size;
  let html = `<div class="wrap">
  <section class="hero">
    <div class="micro">${esc(D.config.name)} · storyboard · ${S.target_minutes || D.config.target_minutes} min target</div>
    <h1>${esc(S.title)}</h1>
    <p class="logline">${esc(S.logline || "")}</p>
    <div class="tmm">
      <div><div class="micro">Theme</div><div class="v">${esc(S.theme)}</div></div>
      <div><div class="micro">Mood</div><div class="v">${esc(S.mood)}</div></div>
      <div><div class="micro">Motif</div><div class="v">${esc(S.motif || "—")}</div></div>
    </div>
    <div class="idea"><div class="micro">Central idea</div><p>${esc(S.central_idea)}</p></div>
    <div class="notes">
      <div><div class="micro">Music · <a href="#music" style="color:var(--paper-2)">listen →</a></div><p>${esc(S.music || "—")}</p></div>
      <div><div class="micro">Style &amp; pacing</div><p>${esc(S.style_notes || "—")}</p></div>
    </div>
  </section>
  ${renderCoverage()}
  <section class="boardhead">
    <div class="micro">Storyboard · ${S.acts.length} acts</div>
    <div class="statbar">
      <div><div class="n">${fmtLong(total)}</div><div class="l">runtime</div></div>
      <div><div class="n">${shots.length}</div><div class="l">shots</div></div>
      <div><div class="n">${(total / shots.length).toFixed(1)}s</div><div class="l">avg shot</div></div>
      <div><div class="n">${Math.round(100 * vo / total)}%</div><div class="l">under VO</div></div>
      <div><div class="n">${used}<span style="font-size:16px;color:var(--muted)">/${nClips}</span></div><div class="l">clips used</div></div>
      <div class="play"><button class="btn" onclick="openAnim(0)">▶ Play animatic</button></div>
    </div>
    <div class="timeline">${S.acts.map((a, i) => {
      const d = a.shots.reduce((x, s) => x + num(s.out) - num(s.in), 0);
      return `<a href="#act-${i}" style="flex:${d}" title="${esc(a.title)}">${String(i + 1).padStart(2, "0")} ${esc(a.title)}</a>`; }).join("")}</div>
  </section>`;
  for (const [ai, a] of S.acts.entries()) {
    const as = shots.filter(s => s.ai === ai);
    const start = as[0]?.at || 0, d = as.reduce((x, s) => x + s.dur, 0);
    html += `<section class="act" id="act-${ai}">
      <div class="act-head"><div class="act-num">${String(ai + 1).padStart(2, "0")}</div>
        <div><h2>${esc(a.title)}</h2><div class="purpose">${esc(a.purpose || "")}</div></div>
        <div class="range">${fmtLong(start)} – ${fmtLong(start + d)}<br>${as.length} shots · ${(d / Math.max(1, as.length)).toFixed(1)}s avg${a.music ? "<br>♪ " + esc(a.music) : ""}</div></div>
      ${a.vo ? `<details class="vo"><summary>Voiceover draft</summary><p>${esc(a.vo)}</p></details>` : ""}
      <div class="shots">${as.map(shotCard).join("")}</div></section>`;
  }
  return html + `</div><footer><div class="wrap">storian · ${esc(D.config.footage_dir)}</div></footer>`;
}

/* ---------------- coverage review */
const COLS = [["wide", "Wide"], ["medium", "Med"], ["close", "Close"], ["detail", "Detail"],
  ["wide_lens", "Wide"], ["normal", "Norm"], ["tele", "Tele"], ["angle", "Angle"], ["moving", "Move"], ["people", "People"], ["in_out", "In/out"]];
const GAP_COL = { "no-establishing": "wide", "no-wide": "wide", "no-medium": "medium", "no-close": "close", "no-detail": "detail",
  "one-focal-tele": "wide_lens", "one-focal-wide": "tele", "no-tele": "tele", "flat-angle": "angle", "no-movement": "moving",
  "no-people": "people", "no-in-out": "in_out", "thin": "*", "unusable": "*" };
const SIZE_COL = { EWS: "wide", WS: "wide", MWS: "medium", MS: "medium", MCU: "close", CU: "close", ECU: "detail", insert: "detail" };
const FOCAL_COL = { "ultra-wide": "wide_lens", wide: "wide_lens", normal: "normal", tele: "tele" };
let COV_ALL = false, COV_SOLO = false, COV_OPEN = new Set();
const SUBJ_LABEL = { none: "no model", unrecognizable: "anyone, unrecognizable", talent: "needs the model" };
const solo = n => n.subject !== "talent" || !!n.fallback;
const hashStr = s => { let h = 5381; for (const c of String(s)) h = (h * 33 ^ c.charCodeAt(0)) >>> 0; return h.toString(36); };
const gotKey = (sc, n) => `storian:got:${D.config.name}:${sc}:${hashStr(n.shot)}`;
const isGot = k => { try { return localStorage.getItem(k) === "1"; } catch (e) { return false; } };
function toggleGot(k, el) {
  try { el.checked ? localStorage.setItem(k, "1") : localStorage.removeItem(k); } catch (e) {}
  el.closest("li").classList.toggle("got", el.checked); event.stopPropagation();
  if (TAB === "shoot") rerender();
}

function sceneNeeds(sc) {  // the agent's shot list, or the rule-based gaps when the agent hasn't reviewed it
  if (sc.needs.length || sc.reviewed) return sc.needs;
  return sc.gaps.map(g => ({ shot: g.need, why: g.why, priority: g.severity === 3 ? 1 : g.severity === 2 ? 2 : 3, subject: g.subject, auto: true }));
}
function shownNeeds(sc) { const ns = sceneNeeds(sc); return COV_SOLO ? ns.filter(solo) : ns; }
function sceneFlags(sc) {
  const f = new Set(sc.reviewed ? [] : sc.gaps.map(g => GAP_COL[g.code]).filter(Boolean));
  for (const n of sc.needs) {
    if (SIZE_COL[n.size]) f.add(SIZE_COL[n.size]);
    if (FOCAL_COL[n.focal] && n.focal !== "normal") f.add(FOCAL_COL[n.focal]);
    if (n.angle && n.angle !== "eye") f.add("angle");
    if (n.move && !["static", "handheld-still"].includes(n.move)) f.add("moving");
  }
  return f;
}
function scenePri(sc) {
  const ns = shownNeeds(sc);
  return ns.length ? Math.min(...ns.map(n => n.priority || 3)) : 9;
}
function needChip(n) {
  const t = n.auto ? n.shot.split(/[:(,]/)[0].replace(/^(an?|one|the) /, "") : [n.size, n.focal !== "normal" && n.focal, n.move && !["static", "handheld-still"].includes(n.move) && n.move].filter(Boolean).join(" · ");
  return `<span class="chip">${esc(t.length > 34 ? t.slice(0, 32) + "…" : t)}</span>`;
}
const covRank = sc => sc.pri * 100 - sc.score - (sc.importance === "core" ? 5 : 0);
function covScenes() {
  const scenes = D.coverage.scenes.map(sc => ({ ...sc, pri: scenePri(sc), flags: sceneFlags(sc) }));
  const need = scenes.filter(sc => sc.pri < 9 && (sc.reviewed || (sc.importance !== "minor" && sc.score >= 3))).sort((a, b) => covRank(a) - covRank(b));
  return { scenes, need };
}
function renderCoverage() {
  const C = D.coverage;
  if (!C || !C.scenes.length) return "";
  const { scenes, need } = covScenes(), rank = covRank;
  const shown = COV_ALL ? [...scenes].sort((a, b) => rank(a) - rank(b)) : need.filter(sc => sc.pri <= 2);
  const nShots = need.reduce((a, sc) => a + sceneNeeds(sc).length, 0) + C.pickups.length;
  const nSolo = scenes.reduce((a, sc) => a + sceneNeeds(sc).filter(n => n.subject && n.subject !== "talent").length, 0) + C.pickups.filter(n => n.subject !== "talent").length;
  const p1 = need.reduce((a, sc) => a + sceneNeeds(sc).filter(n => n.priority === 1).length, 0) + C.pickups.filter(n => n.priority === 1).length;
  const auto = !C.reviewed;
  const summary = C.summary || `${need.length} of ${scenes.length} scenes are missing coverage a director would expect. ${auto ? "These are rule-based gaps; ask your agent for a director's review (storian knowledge coverage) to turn them into a concrete shot list." : ""}`;
  const head = `<tr><th class="l" rowspan="2">Pri</th><th class="l" rowspan="2">Scene</th><th class="grp" colspan="4">Shot size</th><th class="grp" colspan="3">Focal feel</th><th class="grp" colspan="4">Grammar</th><th class="grp l" rowspan="2">Needs</th></tr>
    <tr>${COLS.map(([k, l], i) => `<th class="${[0, 4, 7].includes(i) ? "grp" : ""}">${l}</th>`).join("")}</tr>`;
  const rows = shown.map(sc => {
    const ns = shownNeeds(sc), open = COV_OPEN.has(sc.id);
    const cells = COLS.map(([k], i) => {
      const v = sc.counts[k] || 0, cls = v ? "have" : sc.flags.has(k) || sc.flags.has("*") ? "gap" : "none";
      return `<td class="${[0, 4, 7].includes(i) ? "g0" : ""}"><span class="cell ${cls}" title="${k}: ${v} usable">${v || (cls === "gap" ? "+" : "·")}</span></td>`;
    }).join("");
    const pri = sc.pri < 9 ? `<span class="pri p${sc.pri}">P${sc.pri}</span>` : `<span class="pri ok">ok</span>`;
    return `<tr class="row ${open ? "open" : ""}" onclick="toggleScene('${sc.id}')"><td class="l">${pri}</td>
      <td class="l"><div class="nm">${esc(sc.name)}</div><div class="sub"><span class="imp ${sc.importance}">${sc.importance}</span> · ${sc.id} · ${sc.n} clips${sc.used.length ? ` · ${sc.used.length} in cut` : ""}${(sc.time_of_day || []).length ? " · " + esc(sc.time_of_day.join("/")) : ""}</div></td>
      ${cells}<td class="l"><div class="needchips">${ns.slice(0, 3).map(needChip).join("")}${ns.length > 3 ? `<span class="chip">+${ns.length - 3}</span>` : ""}${ns.length ? "" : '<span class="chip">covered</span>'}</div></td></tr>
      ${open ? `<tr class="detail"><td colspan="${COLS.length + 3}">${sceneDetail(sc, ns)}</td></tr>` : ""}`;
  }).join("");
  const film = C.film.map(g => `<li><span class="pri p${g.severity === 3 ? 1 : g.severity === 2 ? 2 : 3}">P${g.severity === 3 ? 1 : g.severity === 2 ? 2 : 3}</span><div><div class="what">${esc(g.need)}</div>${g.why ? `<div class="wy">${esc(g.why)}</div>` : ""}</div></li>`).join("");
  return `<section class="cov" id="coverage">
    <div class="cov-top"><div>
      <div class="micro">Coverage review · ${auto ? "rule-based" : "director's notes"}</div>
      <h2>What to shoot <em>next</em></h2>
      <p class="sum">${esc(summary)}</p></div>
      <div class="cov-stats">
        <div><div class="n y">${need.length}</div><div class="l">scenes need shots</div></div>
        <div><div class="n">${nShots}</div><div class="l">shots on list</div></div>
        <div><div class="n y">${p1}</div><div class="l">priority 1</div></div>
        <div><div class="n">${nSolo}</div><div class="l">no model needed</div></div>
        <div><div class="n">${C.pickups.length}</div><div class="l">pickups anywhere</div></div>
      </div></div>
    <div class="covt-wrap desk"><table class="covt">${head}${rows}</table></div>
    <div class="cov-more"><button class="btn" onclick="go('shoot')">Open the shot list →</button><button class="btn ${COV_SOLO ? "" : "ghost"} desk" onclick="COV_SOLO=!COV_SOLO;rerender()">${COV_SOLO ? "✓ " : ""}Only shots I can get without the model</button><button class="btn ghost desk" onclick="COV_ALL=!COV_ALL;rerender()">${COV_ALL ? "Show only priority 1–2" : `Show all ${scenes.length} scenes (${scenes.length - shown.length} more)`}</button>
      <span class="mono desk" style="font-size:11px;color:var(--muted);margin-left:14px"><span class="cell have">3</span> usable clips &nbsp; <span class="cell gap">+</span> gap to shoot &nbsp; click a scene for its shot list</span></div>
    <div class="cov-cols">

/* ---------------- music */
const AUDIO = new Audio(); AUDIO.preload = "none";
let NOW = null;  // {src, title, artist}
const mclock = t => { t = Math.max(0, t || 0); return `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`; };
function trackSrc(t) { if (t.file) return `/media/music/${t.file}`; return t.preview && !t.hotlink_blocked ? t.preview : null; }
function playSrc(src, title, artist, start = 0) {
  if (!src) return;
  if (NOW && NOW.src === src) { togglePlay(); return; }
  NOW = { src, title, artist }; AUDIO.src = src; AUDIO.currentTime = start;
  AUDIO.play().catch(() => {});
  $("#pTitle").textContent = title || ""; $("#pArtist").textContent = artist || "";
  $("#player").classList.add("show"); document.body.classList.add("playing-bar");
}
function playTrack(id, start = 0) {
  const M = D.music; const t = (M.tracks || []).find(x => x.id === id) || (M.references || []).find(x => x.id === id);
  if (t) playSrc(trackSrc(t), t.title, [t.artist, t.source, t.license].filter(Boolean).join(" · "), start);
}
function togglePlay() { AUDIO.paused ? AUDIO.play().catch(() => {}) : AUDIO.pause(); }
function stopPlay() { AUDIO.pause(); NOW = null; $("#player").classList.remove("show"); document.body.classList.remove("playing-bar"); syncPlayButtons(); }
function syncPlayButtons() {
  const on = NOW && !AUDIO.paused ? NOW.src : null;
  $("#pPlay").textContent = AUDIO.paused ? "▶" : "❚❚";
  document.querySelectorAll(".pbtn[data-src]").forEach(b => { const me = b.dataset.src === on; b.classList.toggle("on", me); b.textContent = me ? "❚❚" : "▶"; });
}
AUDIO.addEventListener("play", syncPlayButtons); AUDIO.addEventListener("pause", syncPlayButtons);
AUDIO.addEventListener("timeupdate", () => {
  const d = AUDIO.duration || 0, f = d ? AUDIO.currentTime / d : 0;
  $("#pSeek").value = Math.round(f * 1000); $("#pTime").textContent = `${mclock(AUDIO.currentTime)} / ${mclock(d)}`;
  document.querySelectorAll("svg.wave").forEach(w => { const pr = w.querySelector(".prog"); if (pr) pr.style.clipPath = w.dataset.src === NOW?.src ? `inset(0 ${100 - f * 100}% 0 0)` : "inset(0 100% 0 0)"; });
});
function wave(item) {
  const a = item.analysis || {}, pk = a.peaks?.length ? a.peaks : null, src = trackSrc(item);
  if (!pk) return a.energy?.length ? spark(a.energy) : "";
  const n = pk.length, h = 34, w = 400;
  const d = pk.map((v, i) => `M${(i * w / n).toFixed(1)} ${(h / 2 - v * h / 2).toFixed(1)}v${Math.max(1, v * h).toFixed(1)}h${(w / n * 0.6).toFixed(2)}v-${Math.max(1, v * h).toFixed(1)}z`).join("");
  return `<svg class="wave" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" data-src="${esc(src)}" onclick="seekWave(event, this)"><path d="${d}"/><path class="prog" d="${d}" style="clip-path:inset(0 100% 0 0)"/></svg>`;
}
function spark(e) {
  const w = 400, h = 34, pts = e.map((v, i) => `${(i / (e.length - 1) * w).toFixed(1)},${(h - v * (h - 2) - 1).toFixed(1)}`).join(" ");
  return `<svg class="wave" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--ink-soft)" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}
function seekWave(e, el) {
  if (el.dataset.src !== NOW?.src || !AUDIO.duration) return;
  const r = el.getBoundingClientRect(); AUDIO.currentTime = (e.clientX - r.left) / r.width * AUDIO.duration;
}
function pbtn(item) { const src = trackSrc(item); return `<button class="pbtn" ${src ? `data-src="${esc(src)}"` : `disabled title="not cached yet: ask your agent to run storian music fetch"`} onclick="playTrack('${esc(item.id)}')">▶</button>`; }
function trackMeta(t) {

}
function licBadge(t) { return t.license ? `<span class="lic ${t.youtube_ok === false ? "no" : "ok"}" title="${t.youtube_ok === false ? "not safe for a monetised video" : "OK for a monetised video"}">${esc(t.license)}</span>` : ""; }

  return `<div class="wrap"><h1 class="page-title">Music</h1>
    <p class="lede">${esc(M.direction || D.sequence?.music || "")}</p>
    ${(M.cues || []).some(c => c.chosen && tracks[c.chosen] && trackSrc(tracks[c.chosen])) ? `<button class="btn" style="margin-top:14px" onclick="SCORE=true;openAnim(0)">▶ Play animatic with this music</button>` : ""}
    ${(M.references || []).length ? `<h2 class="section-h">Your references</h2><p class="lede">The tracks you gave as the target sound.</p><div class="refs">${refs}</div>` : ""}
    <h2 class="section-h">Cue sheet</h2><p class="lede">One piece of music per stretch of the film, with candidates to choose from. ● marks the current pick.</p>
    <div class="cues">${cues || `<div class="why">No cues yet.</div>`}</div>
    <h2 class="section-h">All tracks</h2><p class="lede">${(M.tracks || []).length} tracks. Licence badges show whether a track is safe in a monetised video.</p>
    <div class="cue"><div class="cue-body">${lib}</div></div>
    ${credits ? `<h2 class="section-h">Credits</h2><p class="lede">Paste into the YouTube description for the picked Creative Commons tracks.</p><div class="credits">${esc(credits)}</div>` : ""}
    ${(M.errors || []).length ? `<ul class="issues">${M.errors.map(e => `<li class="err">${esc(e)}</li>`).join("")}</ul>` : ""}</div>`;
}

/* temp music under the animatic: each act plays its cue's chosen track */
let SCORE = true, SCORE_CUE = null;
function cueForAct(ai) {
  return (D.music?.cues || []).find(c => (c.acts || []).includes(ai) && c.chosen && trackSrc((D.music.tracks || []).find(t => t.id === c.chosen) || {}));
}
function acts_scored() { return (D.sequence?.acts || []).some((_, i) => cueForAct(i)); }
function toggleScore() { SCORE = !SCORE; SCORE_CUE = null; if (!SCORE) AUDIO.pause(); playAt(A.i); }
function scoreAt(s) {
  const btn = $("#scoreBtn"), has = acts_scored();
  btn.style.display = has ? "" : "none"; btn.classList.toggle("on", SCORE); btn.textContent = SCORE ? "♪ temp music on" : "♪ temp music off";
  if (!has || !SCORE) return false;
  const cue = cueForAct(s.ai);
  if (!cue) { AUDIO.pause(); SCORE_CUE = null; return false; }
  const first = A.shots.find(x => (cue.acts || []).includes(x.ai)), want = (cue.start || 0) + s.at - first.at;
  const t = D.music.tracks.find(x => x.id === cue.chosen), src = trackSrc(t);
  if (SCORE_CUE !== cue.id || NOW?.src !== src) {
    SCORE_CUE = cue.id; NOW = { src, title: t.title, artist: t.artist }; AUDIO.src = src;
    AUDIO.addEventListener("loadedmetadata", () => { AUDIO.currentTime = want; }, { once: true });
  } else if (Math.abs(AUDIO.currentTime - want) > 1.5) AUDIO.currentTime = want;
  AUDIO.play().catch(() => {});
  return true;
}

/* ---------------- animatic */
let A = { i: 0, timer: null, paused: false, shots: [], sub: "" };
function openAnim(i) { A.shots = allShots(); $("#anim").classList.add("open"); playAt(i); }
function closeAnim() {
  clearTimeout(A.timer); if (SCORE_CUE) { AUDIO.pause(); SCORE_CUE = null; }
  const v = $("#animV"); v.pause(); v.removeAttribute("src"); v.style.display = $("#animI").style.display = "none";
  $("#anim").classList.remove("open");
}
function tapStage(e) {
  const x = e.clientX / innerWidth;
  x < 0.3 ? playAt(A.i - 1) : x > 0.7 ? playAt(A.i + 1) : togglePause();
}
function playAt(i) {
  clearTimeout(A.timer);
  if (i >= A.shots.length) return closeAnim();
  A.i = Math.max(0, i); A.paused = false;
  const s = A.shots[A.i], total = A.shots.at(-1).at + A.shots.at(-1).dur;
  const pv = previewUrl(s), v = $("#animV"), img = $("#animI");
  const scored = scoreAt(s);
  if (pv) {
    img.style.display = "none"; v.style.display = "";
    v.muted = scored; v.src = pv; v.onended = () => playAt(A.i + 1);
    v.play().catch(() => { v.muted = true; v.play().catch(() => {}); });
  } else {
    v.pause(); v.removeAttribute("src"); v.style.display = "none";
    img.style.display = ""; img.src = frameUrl(s.clip, num(s.in) + 0.3);
    A.timer = setTimeout(() => playAt(A.i + 1), s.dur * 1000);
  }
  if (s.vo_line) A.sub = s.vo_line; else if (s.role !== "vo") A.sub = "";
  $("#sub").textContent = A.sub ? `“${A.sub}”` : "";
  $("#hudL").textContent = `${String(s.ai + 1).padStart(2, "0")} ${s.act.title}`;
  $("#hudR").textContent = `${s.id} · ${s.clip} ${fmt(num(s.in))}–${fmt(num(s.out))} · ${fmt(s.at)} / ${fmt(total)}`;
  $("#bar").style.width = `${100 * s.at / total}%`;
  const nxt = A.shots[A.i + 1] && previewUrl(A.shots[A.i + 1]);
  if (nxt) { const pre = document.createElement("link"); pre.rel = "preload"; pre.as = "video"; pre.href = nxt; document.head.appendChild(pre); }
}
function togglePause() {
  const v = $("#animV");
  if (v.getAttribute("src")) { v.paused ? v.play() : v.pause(); if (SCORE_CUE) v.paused ? AUDIO.pause() : AUDIO.play().catch(() => {}); }
  else if (A.timer) { clearTimeout(A.timer); A.timer = null; } else playAt(A.i + 1);
}
document.addEventListener("keydown", e => {
  if ($("#anim").classList.contains("open")) {
    if (e.key === "Escape") closeAnim();
    else if (e.key === " ") { e.preventDefault(); togglePause(); }
    else if (e.key === "ArrowRight") playAt(A.i + 1);
    else if (e.key === "ArrowLeft") playAt(A.i - 1);
  } else if (e.key === "Escape") closeDrawer();
});

/* ---------------- treatments */
function renderTreatments() {
  const st = D.story;
  if (!st) return `<div class="wrap empty">No treatments yet. Your agent writes them to story.json after labeling.</div>`;
  return `<div class="wrap"><h1 class="page-title">Treatments</h1>
    <p class="lede">${esc(st.footage_summary || "")}</p>
    <div class="treat">${(st.options || []).map((o, i) => `<div class="${st.chosen === i ? "chosen" : ""}">
      <div class="micro">${st.chosen === i ? '<span style="color:var(--paper-2)">● chosen</span>' : `option ${i + 1}`}</div>
      <h3>${esc(o.title)}</h3><p style="font:italic 19px/1.35 var(--serif);color:var(--muted)">${esc(o.logline)}</p>
      <dl class="kv"><dt>theme</dt><dd>${esc(o.theme)}</dd><dt>mood</dt><dd>${esc(o.mood)}</dd><dt>motif</dt><dd>${esc(o.motif)}</dd><dt>music</dt><dd>${esc(o.music)}</dd></dl>
      <p>${esc(o.central_idea)}</p>
      <ol>${(o.arc || []).map(x => `<li>${esc(x)}</li>`).join("")}</ol>
      ${(o.sample_vo || []).map(x => `<div class="voline" style="margin:6px 0">“${esc(x)}”</div>`).join("")}
      <p class="why" style="margin-top:14px">${esc(o.footage_fit || "")}</p></div>`).join("")}</div>
    ${st.human_notes ? `<p class="lede">Notes: ${esc(st.human_notes)}</p>` : ""}</div>`;
}

/* ---------------- library */
function renderLibraryShell() {
  const sizes = [...new Set(Object.values(D.labels).map(l => l.shot_size).filter(Boolean))].sort();
  const n = Object.keys(D.clips).length, nl = Object.keys(D.labels).length;
  return `<div class="wrap"><h1 class="page-title">Library</h1><p class="lede">${n} clips · ${nl} labeled. Click a clip for its full log.</p>
    <div class="toolbar"><input id="q" placeholder="search: tram, night, hands, food…" oninput="renderLibrary()">
    <select id="fs" onchange="renderLibrary()"><option value="">any size</option>${sizes.map(s => `<option>${esc(s)}</option>`).join("")}</select>
    <select id="fq" onchange="renderLibrary()"><option value="0">any quality</option><option value="4">★★★★+</option><option value="5">★★★★★</option></select>
    <select id="fu" onchange="renderLibrary()"><option value="">all</option><option value="used">used</option><option value="unused">unused</option></select></div>
    <div class="lib" id="lib"></div></div>`;
}
function renderLibrary() {
  const q = ($("#q")?.value || "").toLowerCase(), fs = $("#fs")?.value, fq = +($("#fq")?.value || 0), fu = $("#fu")?.value;
  const used = {}; allShots().forEach(s => (used[s.clip] ||= []).push(s.id));
  const ids = Object.keys(D.clips).filter(id => {
    const L = D.labels[id] || {};
    if (fs && L.shot_size !== fs) return false;
    if (fq && (L.quality || 0) < fq) return false;
    if (fu === "used" && !used[id]) return false;
    if (fu === "unused" && used[id]) return false;
    return !q || (id + JSON.stringify(L)).toLowerCase().includes(q);
  });
  $("#lib").innerHTML = ids.map(id => {
    const L = D.labels[id] || {}; const c = D.clips[id];
    return `<article class="shot" data-clip="${id}"><img class="sh" loading="lazy" src="/media/sheets/${id}.jpg">
      <div class="meta"><div class="row1"><b>${id}</b><span>${c.duration.toFixed(1)}s ${L.quality ? "· " + "★".repeat(L.quality) : ""} ${used[id] ? `· <span class="used">${used[id].join(" ")}</span>` : ""}</span></div>
      <div class="chips">${[L.shot_size, L.focal_feel, L.camera_move, L.time_of_day].filter(Boolean).map(x => `<span class="chip k">${esc(x)}</span>`).join("")}</div>
      <div class="summary">${esc(L.summary || "not labeled yet")}</div></div></article>`;
  }).join("") || `<div class="empty">No clips match.</div>`;
  bindShots();
}

/* ---------------- checks */
function renderChecks() {
  const c = D.check;
  if (!c) return `<div class="wrap empty">No sequence to check yet.</div>`;
  return `<div class="wrap"><h1 class="page-title">Checks</h1><p class="lede">Output of <span class="mono">storian check</span>: hard errors block the sequence; warnings are editing-rule lints the agent should fix or justify.</p>
    <div class="statbar">${Object.entries(c.stats).map(([k, v]) => `<div><div class="n">${v}</div><div class="l">${k.replace(/_/g, " ")}</div></div>`).join("")}</div>
    <h2 style="font:400 30px var(--serif);margin-top:36px">Errors (${c.errors.length})</h2><ul class="issues">${c.errors.map(e => `<li class="err">${esc(e)}</li>`).join("") || "<li>none</li>"}</ul>
    <h2 style="font:400 30px var(--serif)">Warnings (${c.warnings.length})</h2><ul class="issues">${c.warnings.map(e => `<li>${esc(e)}</li>`).join("") || "<li>none</li>"}</ul></div>`;
}

function go(tab) { TAB = tab; if (location.hash.slice(1) !== tab) history.pushState(null, "", "#" + tab); closeDrawer(); render(); scrollTo(0, 0); }
document.querySelectorAll("#nav button").forEach(b => b.addEventListener("click", () => go(b.dataset.tab)));
addEventListener("hashchange", () => { const h = location.hash.slice(1); if (TABS.includes(h) && h !== TAB) go(h); });
addEventListener("popstate", () => { const h = location.hash.slice(1) || "board"; if (TABS.includes(h) && h !== TAB) go(h); });
// hosted: save every scene's frames up front, so the whole shot list works with no signal
async function warmShotList() {
  if (!("caches" in window) || !D.coverage) return;
  const urls = [...new Set(D.coverage.scenes.flatMap(sc => sc.thumbs.map(t => frameUrl(t.clip, t.t))))].filter(Boolean);
  try {
    const c = await caches.open("storian-media-v1");
    const have = new Set((await c.keys()).map(r => new URL(r.url).pathname));
    for (const u of urls) if (!have.has(u)) await c.add(u).catch(() => {});
  } catch (e) {}
}
load().then(() => {
  if (D.hosted && "serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").then(warmShotList).catch(() => {});
  poll();
});
</script>
