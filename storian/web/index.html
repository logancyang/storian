<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storian Storyboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #000000;
  --ink: #FFFFFF;
  --paper-2: #FFD147;
  --ink-soft: #5765FF;
  --grid: rgba(255,255,255,0.10);
  --ink-faint: rgba(255,255,255,0.18);
  --muted: rgba(255,255,255,0.62);
  --card: #0b0b0d;
  --serif: "Newsreader", Georgia, serif;
  --sans: "Hanken Grotesk", system-ui, sans-serif;
  --mono: "DM Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--sans);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 32px 32px; background-attachment: fixed;
}
a { color: inherit; }
.micro { font: 600 12px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.mono { font-family: var(--mono); letter-spacing: .04em; }
.wrap { max-width: 1440px; margin: 0 auto; padding: 0 32px; }

/* top bar */
header.top { position: sticky; top: 0; z-index: 20; background: rgba(0,0,0,.88); backdrop-filter: blur(8px); border-bottom: 1.5px solid var(--ink); }
header.top .wrap { display: flex; align-items: center; gap: 24px; height: 56px; }
.brand { font: 500 14px var(--mono); letter-spacing: .2em; }
.brand b { color: var(--paper-2); font-weight: 500; }
nav { display: flex; gap: 4px; margin-left: 8px; }
nav button { background: none; border: 0; color: var(--muted); font: 600 12px var(--sans); letter-spacing: .14em; text-transform: uppercase; padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; }
nav button.on { color: var(--ink); border-color: var(--paper-2); }
.spacer { flex: 1; }
.live { font: 12px var(--mono); color: var(--muted); display: flex; align-items: center; gap: 8px; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-soft); display: inline-block; }
.live.flash i { background: var(--paper-2); }

/* hero */
.hero { padding: 56px 0 32px; border-bottom: 1.5px solid var(--ink); }
.hero h1 { font: 400 clamp(48px, 7vw, 104px)/0.92 var(--serif); letter-spacing: -0.01em; margin: 14px 0 18px; }
.hero .logline { font: italic 400 clamp(20px, 2vw, 28px)/1.25 var(--serif); color: var(--muted); max-width: 900px; margin: 0 0 40px; }
.tmm { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1.5px solid var(--ink); }
.tmm > div { padding: 20px 24px 24px 0; border-right: 1px solid var(--ink-faint); }
.tmm > div + div { padding-left: 24px; }
.tmm > div:last-child { border-right: 0; }
.tmm .v { font: 400 clamp(22px, 2.2vw, 32px)/1.15 var(--serif); margin-top: 10px; }
.idea { display: grid; grid-template-columns: 220px 1fr; gap: 24px; border-top: 1px solid var(--ink-faint); padding: 28px 0; }
.idea p { font: 400 clamp(18px, 1.6vw, 22px)/1.55 var(--serif); margin: 0; max-width: 980px; }
.notes { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; border-top: 1px solid var(--ink-faint); padding: 20px 0 0; color: var(--muted); }
.notes p { margin: 8px 0 0; }
.statbar { display: flex; flex-wrap: wrap; gap: 0; margin-top: 32px; border: 1.5px solid var(--ink); }
.statbar > div { padding: 14px 22px; border-right: 1px solid var(--ink-faint); }
.statbar .n { font: 400 30px/1 var(--serif); }
.statbar .l { font: 11px var(--mono); color: var(--muted); letter-spacing: .08em; margin-top: 6px; text-transform: uppercase; }
.statbar .play { margin-left: auto; border-right: 0; display: flex; align-items: center; }
.btn { background: var(--paper-2); color: #000; border: 0; font: 600 13px var(--sans); letter-spacing: .14em; text-transform: uppercase; padding: 14px 22px; cursor: pointer; }
.btn.ghost { background: none; color: var(--ink); border: 1.5px solid var(--ink); }

/* act timeline */
.timeline { display: flex; height: 40px; margin: 28px 0 0; border: 1.5px solid var(--ink); }
.timeline a { display: flex; align-items: center; padding: 0 10px; text-decoration: none; font: 11px var(--mono); white-space: nowrap; overflow: hidden; border-right: 1px solid var(--ink-faint); }
.timeline a:nth-child(odd) { background: rgba(87,101,255,.22); }
.timeline a:hover { background: var(--ink-soft); }

/* acts */
.act { padding: 48px 0 8px; }
.act-head { display: grid; grid-template-columns: 120px 1fr auto; gap: 24px; align-items: end; border-bottom: 1.5px solid var(--ink); padding-bottom: 14px; }
.act-num { font: 400 72px/0.8 var(--serif); color: var(--paper-2); }
.act-head h2 { font: 400 40px/1 var(--serif); margin: 0 0 8px; }
.act-head .purpose { color: var(--muted); max-width: 820px; }
.act-head .range { font: 12px var(--mono); color: var(--muted); text-align: right; line-height: 1.7; }
details.vo { margin: 14px 0 0 144px; border-left: 2px solid var(--paper-2); padding: 4px 0 4px 16px; }
details.vo summary { cursor: pointer; font: 600 11px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--paper-2); }
details.vo p { font: italic 400 19px/1.55 var(--serif); margin: 10px 0 0; white-space: pre-wrap; max-width: 900px; }

.shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; margin-top: 22px; }
.shot { background: var(--card); border: 1px solid var(--ink-faint); cursor: pointer; display: flex; flex-direction: column; transition: border-color .15s; }
.shot:hover, .shot.sel { border-color: var(--paper-2); }
.thumb { position: relative; aspect-ratio: 16/9; background: #111; overflow: hidden; }
.thumb img, .thumb video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.thumb video { opacity: 0; transition: opacity .15s; }
.thumb.playing video { opacity: 1; }
.tag { position: absolute; font: 500 11px var(--mono); padding: 3px 7px; background: rgba(0,0,0,.78); letter-spacing: .06em; }
.tag.id { top: 8px; left: 8px; }
.tag.role { top: 8px; right: 8px; text-transform: uppercase; }
.tag.role.vo { background: var(--paper-2); color: #000; }
.tag.role.broll, .tag.role.natsound, .tag.role.hook, .tag.role.hold, .tag.role.title { background: var(--ink-soft); color: #fff; }
.tag.dur { bottom: 8px; right: 8px; }
.tag.cut { bottom: 8px; left: 8px; color: var(--paper-2); }
.strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: #000; }
.strip img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; opacity: .85; }
.meta { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.meta .row1 { display: flex; justify-content: space-between; font: 12px var(--mono); }
.meta .row1 b { font-weight: 500; color: var(--ink); }
.meta .row1 span { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font: 11px var(--mono); padding: 2px 7px; border: 1px solid var(--ink-faint); color: var(--muted); }
.chip.k { border-color: var(--ink-soft); color: #c9ceff; }
.voline { font: italic 400 17px/1.35 var(--serif); color: var(--paper-2); }
.voline.none { font: 11px var(--mono); color: var(--muted); font-style: normal; letter-spacing: .08em; text-transform: uppercase; }
.why { font-size: 13px; color: var(--muted); line-height: 1.45; }
.summary { font-size: 13px; }

/* drawer */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100vw); background: #050505; border-left: 1.5px solid var(--ink); z-index: 40; transform: translateX(100%); transition: transform .2s; overflow-y: auto; }
.drawer.open { transform: none; }
.drawer .in { padding: 24px 28px 48px; }
.drawer video, .drawer .still { width: 100%; aspect-ratio: 16/9; background: #111; display: block; object-fit: cover; }
.drawer h3 { font: 400 34px/1.05 var(--serif); margin: 18px 0 6px; }
.drawer .close { position: sticky; top: 0; float: right; z-index: 2; }
.kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 16px; margin: 18px 0; font-size: 14px; }
.kv dt { font: 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; padding-top: 3px; }
.kv dd { margin: 0; }
.moments { border-top: 1px solid var(--ink-faint); margin-top: 8px; }
.moments div { padding: 8px 0; border-bottom: 1px solid var(--ink-faint); font-size: 14px; }
.moments .mono { color: var(--paper-2); margin-right: 10px; }
.sheet { width: 100%; margin-top: 16px; border: 1px solid var(--ink-faint); }
.copy { cursor: pointer; border-bottom: 1px dashed var(--muted); }

/* animatic */
.animatic { position: fixed; inset: 0; background: #000; z-index: 60; display: none; flex-direction: column; }
.animatic.open { display: flex; }
.animatic .stage { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; }
.animatic video, .animatic img { max-width: 100%; max-height: 100%; position: absolute; inset: 0; margin: auto; width: 100%; height: 100%; object-fit: contain; }
.animatic .sub { position: absolute; left: 0; right: 0; bottom: 64px; text-align: center; font: italic 400 clamp(20px, 2.4vw, 34px)/1.3 var(--serif); color: var(--paper-2); text-shadow: 0 2px 12px #000; padding: 0 10%; }
.animatic .hud { position: absolute; top: 18px; left: 24px; right: 24px; display: flex; justify-content: space-between; font: 12px var(--mono); color: var(--muted); }
.animatic .bar { height: 4px; background: var(--ink-faint); }
.animatic .bar i { display: block; height: 100%; background: var(--paper-2); width: 0; }
.animatic .keys { font: 11px var(--mono); color: var(--muted); text-align: center; padding: 10px; }

/* library + treatments */
.toolbar { display: flex; gap: 12px; align-items: center; padding: 28px 0 18px; flex-wrap: wrap; }
.toolbar input, .toolbar select { background: #000; color: var(--ink); border: 1.5px solid var(--ink); font: 14px var(--mono); padding: 10px 12px; }
.toolbar input { flex: 1; min-width: 220px; }
.lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 18px; padding-bottom: 60px; }
.lib .shot img.sh { width: 100%; display: block; }
.used { color: var(--paper-2); }
.treat { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 18px; padding: 24px 0 60px; }
.treat > div { border: 1.5px solid var(--ink-faint); padding: 24px; background: var(--card); }
.treat > div.chosen { border-color: var(--paper-2); }
.treat h3 { font: 400 36px/1 var(--serif); margin: 10px 0; }
.treat ol { padding-left: 18px; color: var(--muted); }
.page-title { font: 400 56px/1 var(--serif); margin: 48px 0 8px; }
.lede { color: var(--muted); max-width: 900px; font-size: 17px; }
.issues li { margin: 6px 0; font: 13px var(--mono); }
.issues .err { color: #ff7b7b; }
.empty { padding: 80px 0; font: 400 28px/1.3 var(--serif); color: var(--muted); }
footer { border-top: 1.5px solid var(--ink); margin-top: 60px; padding: 18px 0 40px; font: 12px var(--mono); color: var(--muted); }

@media (max-width: 820px) {
  .wrap { padding: 0 16px; }
  .tmm, .notes, .idea { grid-template-columns: 1fr; }
  .tmm > div, .tmm > div + div { padding: 16px 0; border-right: 0; border-bottom: 1px solid var(--ink-faint); }
  .act-head { grid-template-columns: 1fr; }
  details.vo { margin-left: 0; }
  nav button { padding: 8px 6px; letter-spacing: .08em; }
  .live span { display: none; }
  .lib { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand">STORIAN<b>.</b></div>
  <nav id="nav">
    <button data-tab="board" class="on">Storyboard</button>
    <button data-tab="treat">Treatments</button>
    <button data-tab="lib">Library</button>
    <button data-tab="checks">Checks</button>
  </nav>
  <div class="spacer"></div>
  <div class="live" id="live"><i></i><span>live · edits from your agent appear here</span></div>
</div></header>

<main id="app"><div class="wrap empty">Loading…</div></main>

<aside class="drawer" id="drawer"><div class="in" id="drawerIn"></div></aside>

<div class="animatic" id="anim">
  <div class="stage" id="stage">
    <div class="hud"><span id="hudL"></span><span id="hudR"></span></div>
    <div class="sub" id="sub"></div>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div class="keys">space pause · ← → shot · esc close</div>
</div>

<script>
let D = null, TAB = location.hash.slice(1) || "board", VERSION = 0;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = v => typeof v === "number" ? v : String(v).split(":").reduce((a, p) => a * 60 + parseFloat(p), 0);
const fmt = t => { t = Math.max(0, t); const m = Math.floor(t / 60), s = t - m * 60; return `${String(m).padStart(2, "0")}:${s.toFixed(1).padStart(4, "0")}`; };
const fmtLong = t => { const m = Math.floor(t / 60), s = Math.round(t - m * 60); return `${m}:${String(s).padStart(2, "0")}`; };

function frameUrl(clip, t) {
  const f = D.frames[clip];
  if (!f || !f.t.length) return "";
  let best = f.t[0];
  for (const x of f.t) { if (x <= t + 0.5) best = x; else break; }
  return `/media/frames/${clip}/t${best.toFixed(3).padStart(9, "0")}.jpg`;
}
function previewUrl(s) {
  const name = `${s.clip}_${num(s.in).toFixed(2)}_${num(s.out).toFixed(2)}.mp4`;
  return D.previews.includes(name) ? `/media/previews/${name}` : null;
}
function allShots() {
  const out = []; let t = 0, n = 0;
  for (const [ai, a] of (D.sequence?.acts || []).entries())
    for (const s of a.shots) {
      const dur = num(s.out) - num(s.in);
      out.push({ ...s, act: a, ai, idx: n++, at: t, dur }); t += dur;
    }
  return out;
}

async function load() {
  D = await (await fetch("/api/project")).json();
  render();
}
async function poll() {
  try {
    const { v } = await (await fetch("/api/version")).json();
    if (VERSION && v !== VERSION) {
      const y = scrollY; await load(); scrollTo(0, y);
      $("#live").classList.add("flash"); setTimeout(() => $("#live").classList.remove("flash"), 1200);
    }
    VERSION = v;
  } catch (e) {}
  setTimeout(poll, 2000);
}

function render() {
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === TAB));
  const app = $("#app");
  if (TAB === "treat") app.innerHTML = renderTreatments();
  else if (TAB === "lib") { app.innerHTML = renderLibraryShell(); renderLibrary(); }
  else if (TAB === "checks") app.innerHTML = renderChecks();
  else app.innerHTML = renderBoard();
  bindShots();
}

/* ---------------- storyboard */
function renderBoard() {
  const S = D.sequence;
  if (!S) {
    const st = D.story;
    return `<div class="wrap empty">No sequence yet.<br><span class="lede">${st ? "Treatments are ready — pick one in the Treatments tab and tell your agent." : "Ask your agent to run the storian pipeline (storian status shows the next step)."}</span></div>`;
  }
  const shots = allShots();
  const total = shots.reduce((a, s) => a + s.dur, 0);
  const vo = shots.filter(s => s.role === "vo" || s.vo_line).reduce((a, s) => a + s.dur, 0);
  const nClips = Object.keys(D.clips).length;
  const used = new Set(shots.map(s => s.clip)).size;
  let html = `<div class="wrap">
  <section class="hero">
    <div class="micro">${esc(D.config.name)} · storyboard · ${S.target_minutes || D.config.target_minutes} min target</div>
    <h1>${esc(S.title)}</h1>
    <p class="logline">${esc(S.logline || "")}</p>
    <div class="tmm">
      <div><div class="micro">Theme</div><div class="v">${esc(S.theme)}</div></div>
      <div><div class="micro">Mood</div><div class="v">${esc(S.mood)}</div></div>
      <div><div class="micro">Motif</div><div class="v">${esc(S.motif || "—")}</div></div>
    </div>
    <div class="idea"><div class="micro">Central idea</div><p>${esc(S.central_idea)}</p></div>
    <div class="notes">
      <div><div class="micro">Music</div><p>${esc(S.music || "—")}</p></div>
      <div><div class="micro">Style &amp; pacing</div><p>${esc(S.style_notes || "—")}</p></div>
    </div>
    <div class="statbar">
      <div><div class="n">${fmtLong(total)}</div><div class="l">runtime</div></div>
      <div><div class="n">${shots.length}</div><div class="l">shots</div></div>
      <div><div class="n">${(total / shots.length).toFixed(1)}s</div><div class="l">avg shot</div></div>
      <div><div class="n">${Math.round(100 * vo / total)}%</div><div class="l">under VO</div></div>
      <div><div class="n">${used}<span style="font-size:16px;color:var(--muted)">/${nClips}</span></div><div class="l">clips used</div></div>
      <div class="play"><button class="btn" onclick="openAnim(0)">▶ Play animatic</button></div>
    </div>
    <div class="timeline">${S.acts.map((a, i) => {
      const d = a.shots.reduce((x, s) => x + num(s.out) - num(s.in), 0);
      return `<a href="#act-${i}" style="flex:${d}" title="${esc(a.title)}">${String(i + 1).padStart(2, "0")} ${esc(a.title)}</a>`; }).join("")}</div>
  </section>`;
  for (const [ai, a] of S.acts.entries()) {
    const as = shots.filter(s => s.ai === ai);
    const start = as[0]?.at || 0, d = as.reduce((x, s) => x + s.dur, 0);
    html += `<section class="act" id="act-${ai}">
      <div class="act-head"><div class="act-num">${String(ai + 1).padStart(2, "0")}</div>
        <div><h2>${esc(a.title)}</h2><div class="purpose">${esc(a.purpose || "")}</div></div>
        <div class="range">${fmtLong(start)} – ${fmtLong(start + d)}<br>${as.length} shots · ${(d / Math.max(1, as.length)).toFixed(1)}s avg${a.music ? "<br>♪ " + esc(a.music) : ""}</div></div>
      ${a.vo ? `<details class="vo"><summary>Voiceover draft</summary><p>${esc(a.vo)}</p></details>` : ""}
      <div class="shots">${as.map(shotCard).join("")}</div></section>`;
  }
  return html + `</div><footer><div class="wrap">storian · ${esc(D.config.footage_dir)}</div></footer>`;
}

function shotCard(s) {
  const L = D.labels[s.clip] || {};
  const t0 = num(s.in), t1 = num(s.out), mid = (t0 + t1) / 2;
  const pv = previewUrl(s);
  return `<article class="shot" data-idx="${s.idx}">
    <div class="thumb" ${pv ? `data-pv="${pv}"` : ""}>
      <img loading="lazy" src="${frameUrl(s.clip, t0 + 0.3)}" alt="">
      <span class="tag id">${esc(s.id)} · ${fmt(s.at)}</span>
      <span class="tag role ${esc(s.role)}">${esc(s.role || "")}</span>
      ${s.cut ? `<span class="tag cut">⟶ ${esc(s.cut)}</span>` : ""}
      <span class="tag dur">${s.dur.toFixed(1)}s</span>
    </div>
    <div class="strip"><img loading="lazy" src="${frameUrl(s.clip, t0)}"><img loading="lazy" src="${frameUrl(s.clip, mid)}"><img loading="lazy" src="${frameUrl(s.clip, t1 - 0.2)}"></div>
    <div class="meta">
      <div class="row1"><b>${esc(s.clip)}</b><span>in ${fmt(t0)} → out ${fmt(t1)}</span></div>
      <div class="chips">${[L.shot_size, L.focal_feel, L.camera_move, L.angle !== "eye" ? L.angle : null].filter(Boolean).map(x => `<span class="chip k">${esc(x)}</span>`).join("")}${(L.mood || []).slice(0, 2).map(x => `<span class="chip">${esc(x)}</span>`).join("")}</div>
      ${s.vo_line ? `<div class="voline">“${esc(s.vo_line)}”</div>` : `<div class="voline none">${s.role === "vo" ? "under VO ↑" : s.role === "natsound" ? "nat sound" : "no VO · music"}</div>`}
      <div class="why">${esc(s.why || L.summary || "")}</div>
    </div></article>`;
}

function bindShots() {
  document.querySelectorAll(".shot[data-idx]").forEach(el => {
    const th = $(".thumb", el);
    el.addEventListener("click", () => openShot(+el.dataset.idx));
    if (th?.dataset.pv) {
      let v;
      el.addEventListener("mouseenter", () => {
        if (!v) { v = document.createElement("video"); v.src = th.dataset.pv; v.muted = true; v.loop = true; v.playsInline = true; th.insertBefore(v, th.children[1]); }
        v.currentTime = 0; v.play().then(() => th.classList.add("playing")).catch(() => {});
      });
      el.addEventListener("mouseleave", () => { th.classList.remove("playing"); v && v.pause(); });
    }
  });
  document.querySelectorAll(".lib .shot[data-clip]").forEach(el => el.addEventListener("click", () => openClip(el.dataset.clip)));
}

function labelKV(L) {
  const rows = [["summary", L.summary], ["location", L.location], ["action", L.action], ["time", L.time_of_day],
    ["shot", [L.shot_size, L.focal_feel, L.angle, L.camera_move].filter(Boolean).join(" · ")],
    ["composition", L.composition], ["light", L.light], ["mood", (L.mood || []).join(", ")],
    ["story role", (L.story_role || []).join(", ")], ["audio", L.audio], ["quality", L.quality ? "★".repeat(L.quality) + "☆".repeat(5 - L.quality) : ""],
    ["issues", (L.issues || []).join(", ")], ["tags", (L.tags || []).join(", ")]];
  return `<dl class="kv">${rows.filter(r => r[1]).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`;
}
function momentsHTML(L) {
  return (L.moments || []).length ? `<div class="micro" style="margin-top:20px">Moments</div><div class="moments">${L.moments.map(m =>
    `<div><span class="mono">${fmt(m.in)}–${fmt(m.out)}</span>${"★".repeat(m.score || 0)} ${esc(m.desc)}${m.match_action ? ` <span class="chip k">match: ${esc(m.match_action)}</span>` : ""}</div>`).join("")}</div>` : "";
}
function openShot(i) {
  const s = allShots()[i]; const L = D.labels[s.clip] || {}; const c = D.clips[s.clip] || {};
  const pv = previewUrl(s);
  document.querySelectorAll(".shot.sel").forEach(e => e.classList.remove("sel"));
  document.querySelector(`.shot[data-idx="${i}"]`)?.classList.add("sel");
  const tc = `${s.clip}  ${fmt(num(s.in))} → ${fmt(num(s.out))}`;
  $("#drawerIn").innerHTML = `<button class="btn ghost close" onclick="closeDrawer()">✕</button>
    <div class="micro">${esc(s.id)} · act ${s.ai + 1} · ${esc(s.act.title)} · at ${fmt(s.at)}</div>
    <h3>${esc(s.clip)}</h3>
    ${pv ? `<video src="${pv}" controls autoplay playsinline></video>` : `<img class="still" src="${frameUrl(s.clip, num(s.in) + 0.3)}">`}
    <dl class="kv">
      <dt>in / out</dt><dd><span class="copy" title="copy" onclick="navigator.clipboard.writeText('${tc}')">${fmt(num(s.in))} → ${fmt(num(s.out))}</span> &nbsp;(${s.dur.toFixed(2)}s)</dd>
      <dt>role</dt><dd>${esc(s.role)}</dd><dt>cut in</dt><dd>${esc(s.cut || "")}</dd>
      ${s.vo_line ? `<dt>vo line</dt><dd class="voline">“${esc(s.vo_line)}”</dd>` : ""}
      <dt>director</dt><dd>${esc(s.why || "")}</dd>
      <dt>file</dt><dd class="mono" style="font-size:12px;word-break:break-all">${esc(c.path)}</dd>
      <dt>camera</dt><dd>${esc([c.camera, c.lens, c.gamma, c.fps && c.fps + " fps"].filter(Boolean).join(" · "))}</dd>
    </dl>
    <div class="micro">Clip label</div>${labelKV(L)}${momentsHTML(L)}
    <img class="sheet" src="/media/sheets/${s.clip}.jpg">
    <div style="display:flex;gap:10px;margin-top:18px"><button class="btn ghost" onclick="openShot(${Math.max(0, i - 1)})">← prev</button><button class="btn ghost" onclick="openShot(${Math.min(allShots().length - 1, i + 1)})">next →</button><button class="btn" onclick="closeDrawer();openAnim(${i})">▶ play from here</button></div>`;
  $("#drawer").classList.add("open"); $("#drawer").scrollTop = 0;
}
function openClip(id) {
  const L = D.labels[id] || {}; const c = D.clips[id] || {};
  const uses = allShots().filter(s => s.clip === id);
  $("#drawerIn").innerHTML = `<button class="btn ghost close" onclick="closeDrawer()">✕</button>
    <div class="micro">${c.duration?.toFixed(1)}s · ${esc(c.recorded_at || "")}</div><h3>${esc(id)}</h3>
    <img class="sheet" src="/media/sheets/${id}.jpg">
    ${uses.length ? `<p class="used mono">used in ${uses.map(s => s.id).join(", ")}</p>` : ""}
    ${labelKV(L)}${momentsHTML(L)}
    <dl class="kv"><dt>file</dt><dd class="mono" style="font-size:12px;word-break:break-all">${esc(c.path)}</dd></dl>`;
  $("#drawer").classList.add("open"); $("#drawer").scrollTop = 0;
}
function closeDrawer() { $("#drawer").classList.remove("open"); $("#drawer video")?.pause(); }

/* ---------------- animatic */
let A = { i: 0, timer: null, paused: false, shots: [], sub: "" };
function openAnim(i) { A.shots = allShots(); $("#anim").classList.add("open"); playAt(i); }
function closeAnim() { clearTimeout(A.timer); $("#stage").querySelectorAll("video,img").forEach(e => e.remove()); $("#anim").classList.remove("open"); }
function playAt(i) {
  clearTimeout(A.timer);
  if (i >= A.shots.length) return closeAnim();
  A.i = Math.max(0, i); A.paused = false;
  const s = A.shots[A.i], st = $("#stage"), total = A.shots.at(-1).at + A.shots.at(-1).dur;
  st.querySelectorAll("video,img").forEach(e => e.remove());
  const pv = previewUrl(s);
  let el;
  if (pv) { el = document.createElement("video"); el.src = pv; el.autoplay = true; el.playsInline = true; el.onended = () => playAt(A.i + 1); }
  else { el = document.createElement("img"); el.src = frameUrl(s.clip, num(s.in) + 0.3); A.timer = setTimeout(() => playAt(A.i + 1), s.dur * 1000); }
  st.insertBefore(el, st.firstChild);
  if (s.vo_line) A.sub = s.vo_line; else if (s.role !== "vo") A.sub = "";
  $("#sub").textContent = A.sub ? `“${A.sub}”` : "";
  $("#hudL").textContent = `${String(s.ai + 1).padStart(2, "0")} ${s.act.title}`;
  $("#hudR").textContent = `${s.id} · ${s.clip} ${fmt(num(s.in))}–${fmt(num(s.out))} · ${fmt(s.at)} / ${fmt(total)}`;
  $("#bar").style.width = `${100 * s.at / total}%`;
  const nxt = A.shots[A.i + 1] && previewUrl(A.shots[A.i + 1]);
  if (nxt) { const pre = document.createElement("link"); pre.rel = "preload"; pre.as = "video"; pre.href = nxt; document.head.appendChild(pre); }
}
function togglePause() {
  const v = $("#stage video");
  if (v) { v.paused ? v.play() : v.pause(); }
  else if (A.timer) { clearTimeout(A.timer); A.timer = null; } else playAt(A.i + 1);
}
document.addEventListener("keydown", e => {
  if ($("#anim").classList.contains("open")) {
    if (e.key === "Escape") closeAnim();
    else if (e.key === " ") { e.preventDefault(); togglePause(); }
    else if (e.key === "ArrowRight") playAt(A.i + 1);
    else if (e.key === "ArrowLeft") playAt(A.i - 1);
  } else if (e.key === "Escape") closeDrawer();
});

/* ---------------- treatments */
function renderTreatments() {
  const st = D.story;
  if (!st) return `<div class="wrap empty">No treatments yet. Your agent writes them to story.json after labeling.</div>`;
  return `<div class="wrap"><h1 class="page-title">Treatments</h1>
    <p class="lede">${esc(st.footage_summary || "")}</p>
    <div class="treat">${(st.options || []).map((o, i) => `<div class="${st.chosen === i ? "chosen" : ""}">
      <div class="micro">${st.chosen === i ? '<span style="color:var(--paper-2)">● chosen</span>' : `option ${i + 1}`}</div>
      <h3>${esc(o.title)}</h3><p style="font:italic 19px/1.35 var(--serif);color:var(--muted)">${esc(o.logline)}</p>
      <dl class="kv"><dt>theme</dt><dd>${esc(o.theme)}</dd><dt>mood</dt><dd>${esc(o.mood)}</dd><dt>motif</dt><dd>${esc(o.motif)}</dd><dt>music</dt><dd>${esc(o.music)}</dd></dl>
      <p>${esc(o.central_idea)}</p>
      <ol>${(o.arc || []).map(x => `<li>${esc(x)}</li>`).join("")}</ol>
      ${(o.sample_vo || []).map(x => `<div class="voline" style="margin:6px 0">“${esc(x)}”</div>`).join("")}
      <p class="why" style="margin-top:14px">${esc(o.footage_fit || "")}</p></div>`).join("")}</div>
    ${st.human_notes ? `<p class="lede">Notes: ${esc(st.human_notes)}</p>` : ""}</div>`;
}

/* ---------------- library */
function renderLibraryShell() {
  const sizes = [...new Set(Object.values(D.labels).map(l => l.shot_size).filter(Boolean))].sort();
  const n = Object.keys(D.clips).length, nl = Object.keys(D.labels).length;
  return `<div class="wrap"><h1 class="page-title">Library</h1><p class="lede">${n} clips · ${nl} labeled. Click a clip for its full log.</p>
    <div class="toolbar"><input id="q" placeholder="search: tram, night, hands, food…" oninput="renderLibrary()">
    <select id="fs" onchange="renderLibrary()"><option value="">any size</option>${sizes.map(s => `<option>${esc(s)}</option>`).join("")}</select>
    <select id="fq" onchange="renderLibrary()"><option value="0">any quality</option><option value="4">★★★★+</option><option value="5">★★★★★</option></select>
    <select id="fu" onchange="renderLibrary()"><option value="">all</option><option value="used">used</option><option value="unused">unused</option></select></div>
    <div class="lib" id="lib"></div></div>`;
}
function renderLibrary() {
  const q = ($("#q")?.value || "").toLowerCase(), fs = $("#fs")?.value, fq = +($("#fq")?.value || 0), fu = $("#fu")?.value;
  const used = {}; allShots().forEach(s => (used[s.clip] ||= []).push(s.id));
  const ids = Object.keys(D.clips).filter(id => {
    const L = D.labels[id] || {};
    if (fs && L.shot_size !== fs) return false;
    if (fq && (L.quality || 0) < fq) return false;
    if (fu === "used" && !used[id]) return false;
    if (fu === "unused" && used[id]) return false;
    return !q || (id + JSON.stringify(L)).toLowerCase().includes(q);
  });
  $("#lib").innerHTML = ids.map(id => {
    const L = D.labels[id] || {}; const c = D.clips[id];
    return `<article class="shot" data-clip="${id}"><img class="sh" loading="lazy" src="/media/sheets/${id}.jpg">
      <div class="meta"><div class="row1"><b>${id}</b><span>${c.duration.toFixed(1)}s ${L.quality ? "· " + "★".repeat(L.quality) : ""} ${used[id] ? `· <span class="used">${used[id].join(" ")}</span>` : ""}</span></div>
      <div class="chips">${[L.shot_size, L.focal_feel, L.camera_move, L.time_of_day].filter(Boolean).map(x => `<span class="chip k">${esc(x)}</span>`).join("")}</div>
      <div class="summary">${esc(L.summary || "not labeled yet")}</div></div></article>`;
  }).join("") || `<div class="empty">No clips match.</div>`;
  bindShots();
}

/* ---------------- checks */
function renderChecks() {
  const c = D.check;
  if (!c) return `<div class="wrap empty">No sequence to check yet.</div>`;
  return `<div class="wrap"><h1 class="page-title">Checks</h1><p class="lede">Output of <span class="mono">storian check</span>: hard errors block the sequence; warnings are editing-rule lints the agent should fix or justify.</p>
    <div class="statbar">${Object.entries(c.stats).map(([k, v]) => `<div><div class="n">${v}</div><div class="l">${k.replace(/_/g, " ")}</div></div>`).join("")}</div>
    <h2 style="font:400 30px var(--serif);margin-top:36px">Errors (${c.errors.length})</h2><ul class="issues">${c.errors.map(e => `<li class="err">${esc(e)}</li>`).join("") || "<li>none</li>"}</ul>
    <h2 style="font:400 30px var(--serif)">Warnings (${c.warnings.length})</h2><ul class="issues">${c.warnings.map(e => `<li>${esc(e)}</li>`).join("") || "<li>none</li>"}</ul></div>`;
}

document.querySelectorAll("#nav button").forEach(b => b.addEventListener("click", () => { TAB = b.dataset.tab; location.hash = TAB; closeDrawer(); render(); scrollTo(0, 0); }));
load().then(poll);
</script>
</body>
