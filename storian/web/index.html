<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>Storian Storyboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #000000;
  --ink: #FFFFFF;
  --paper-2: #FFD147;
  --ink-soft: #5765FF;
  --grid: rgba(255,255,255,0.10);
  --ink-faint: rgba(255,255,255,0.18);
  --muted: rgba(255,255,255,0.62);
  --card: #0b0b0d;
  --serif: "Newsreader", Georgia, serif;
  --sans: "Hanken Grotesk", system-ui, sans-serif;
  --mono: "DM Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--sans); }
a { color: inherit; }
.micro { font: 600 11px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.mono { font-family: var(--mono); letter-spacing: .04em; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 32px; }
.muted { color: var(--muted); }
.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }

/* top bar */
header.top { position: sticky; top: 0; z-index: 20; background: rgba(0,0,0,.9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--ink-faint); }
header.top .wrap { display: flex; align-items: center; gap: 24px; height: 56px; }
.brand { font: 500 14px var(--mono); letter-spacing: .2em; }
.brand b { color: var(--paper-2); font-weight: 500; }
nav { display: flex; gap: 4px; margin-left: 8px; }
nav button { background: none; border: 0; color: var(--muted); font: 600 12px var(--sans); letter-spacing: .12em; text-transform: uppercase; padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
nav button.on { color: var(--ink); border-color: var(--paper-2); }
nav .sm { display: none; }
.spacer { flex: 1; }
.live { font: 12px var(--sans); color: var(--muted); display: flex; align-items: center; gap: 8px; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-soft); display: inline-block; }
.live.flash i { background: var(--paper-2); }

/* board */
.hero { padding: 56px 0 40px; }
.hero h1 { font: 400 clamp(48px, 7vw, 96px)/0.95 var(--serif); letter-spacing: -0.01em; margin: 14px 0 16px; }
.hero .logline { font: italic 400 clamp(19px, 2vw, 26px)/1.35 var(--serif); color: var(--muted); max-width: 820px; margin: 0; }
.tone { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; margin: 36px 0 0; max-width: 960px; }
.tone dt { font: 600 11px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--paper-2); margin-bottom: 10px; }
.tone dd { margin: 0; font: 400 clamp(20px, 2vw, 26px)/1.3 var(--serif); }
details.more { margin-top: 28px; max-width: 820px; }
details.more > summary { cursor: pointer; list-style: none; font: 500 14px var(--sans); color: var(--muted); }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::after { content: " +"; }
details.more[open] > summary::after { content: " −"; }
.playrow { display: flex; align-items: center; gap: 20px; margin-top: 36px; flex-wrap: wrap; }
.facts { color: var(--muted); font-size: 14px; }
.btn { background: var(--paper-2); color: #000; border: 0; font: 600 13px var(--sans); letter-spacing: .12em; text-transform: uppercase; padding: 14px 22px; cursor: pointer; }
.btn.ghost { background: none; color: var(--ink); border: 1px solid var(--ink-faint); }
.nextlink { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 28px; padding: 16px 0; border-top: 1px solid var(--ink-faint); border-bottom: 1px solid var(--ink-faint); text-decoration: none; max-width: 820px; }
.nextlink b { font: 400 20px var(--serif); }
.nextlink span { color: var(--muted); font-size: 14px; }

.act { padding: 56px 0 8px; }
.act-head { border-top: 1px solid var(--ink-faint); padding-top: 22px; }
.act-head h2 { font: 400 clamp(28px, 3vw, 38px)/1.05 var(--serif); margin: 10px 0 8px; }
.act-head .purpose { color: var(--muted); max-width: 760px; margin: 0; }
details.vo { margin-top: 12px; max-width: 760px; }
details.vo summary { cursor: pointer; font: 500 14px var(--sans); color: var(--paper-2); list-style: none; }
details.vo summary::-webkit-details-marker { display: none; }
details.vo p { font: italic 400 18px/1.55 var(--serif); margin: 10px 0 0; white-space: pre-wrap; }

.shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 28px 20px; margin-top: 24px; }
.shot { cursor: pointer; display: flex; flex-direction: column; }
.thumb { position: relative; aspect-ratio: 16/9; background: #111; overflow: hidden; outline: 1px solid transparent; transition: outline-color .15s; }
.shot:hover .thumb, .shot.sel .thumb { outline-color: var(--paper-2); }
.thumb img, .thumb video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.thumb video { opacity: 0; transition: opacity .15s; }
.thumb.playing video { opacity: 1; }
.tag { position: absolute; font: 500 11px var(--mono); padding: 2px 6px; background: rgba(0,0,0,.7); }
.tag.dur { bottom: 6px; right: 6px; }
.meta { padding: 10px 0 0; display: flex; flex-direction: column; gap: 4px; }
.sid { font: 12px var(--mono); color: var(--muted); }
.voline { font: italic 400 17px/1.35 var(--serif); color: var(--paper-2); }
.why { font-size: 14px; color: var(--muted); line-height: 1.45; }
.shot .why { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* drawer */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(720px, 100vw); background: #050505; border-left: 1px solid var(--ink-faint); z-index: 40; transform: translateX(100%); transition: transform .2s; overflow-y: auto; }
.drawer.open { transform: none; }
.drawer .in { padding: 24px 28px 48px; }
.drawer video, .drawer .still { width: 100%; aspect-ratio: 16/9; background: #111; display: block; object-fit: cover; }
.drawer h3 { font: 400 32px/1.05 var(--serif); margin: 12px 0 18px; }
.drawer .close { position: sticky; top: 0; float: right; z-index: 2; background: #050505; }
.kv { display: grid; grid-template-columns: 120px 1fr; gap: 8px 16px; margin: 18px 0; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.moments { margin-top: 8px; }
.moments div { padding: 8px 0; border-top: 1px solid var(--ink-faint); font-size: 14px; }
.moments .mono { color: var(--paper-2); margin-right: 10px; }
.sheet { width: 100%; margin-top: 16px; }
.copy { cursor: pointer; border-bottom: 1px dashed var(--muted); }
.drow { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }

/* animatic */
.animatic { position: fixed; inset: 0; background: #000; z-index: 60; display: none; flex-direction: column; }
.animatic.open { display: flex; }
.animatic .stage { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; }
.animatic video, .animatic img { max-width: 100%; max-height: 100%; position: absolute; inset: 0; margin: auto; width: 100%; height: 100%; object-fit: contain; }
.animatic .sub { position: absolute; left: 0; right: 0; bottom: 64px; text-align: center; font: italic 400 clamp(20px, 2.4vw, 34px)/1.3 var(--serif); color: var(--paper-2); text-shadow: 0 2px 12px #000; padding: 0 10%; }
.animatic .hud { position: absolute; top: 18px; left: 64px; right: 24px; display: flex; justify-content: space-between; font: 12px var(--mono); color: var(--muted); }
.animatic .bar { height: 3px; background: var(--ink-faint); }
.animatic .bar i { display: block; height: 100%; background: var(--paper-2); width: 0; }
.animatic .keys { font: 11px var(--mono); color: var(--muted); text-align: center; padding: 10px; }
.animatic .score { position: absolute; top: 44px; right: 24px; font: 12px var(--sans); background: none; border: 1px solid var(--ink-faint); color: var(--muted); padding: 5px 9px; cursor: pointer; }
.animatic .score.on { color: var(--paper-2); border-color: var(--paper-2); }
.animatic .aclose { position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 12px; z-index: 2; width: 40px; height: 40px; background: rgba(0,0,0,.6); border: 1px solid var(--ink-faint); color: var(--ink); font-size: 16px; cursor: pointer; }

/* pages */
.page-title { font: 400 52px/1 var(--serif); margin: 48px 0 12px; }
.lede { color: var(--muted); max-width: 760px; font-size: 16px; margin: 0; }
.section-h { font: 400 30px/1 var(--serif); margin: 52px 0 6px; }
.toolbar { display: flex; gap: 10px; align-items: center; padding: 24px 0 20px; flex-wrap: wrap; }
.toolbar input, .toolbar select { background: #000; color: var(--ink); border: 1px solid var(--ink-faint); font: 15px var(--sans); padding: 10px 12px; }
.toolbar input { flex: 1; min-width: 220px; }
.lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr)); gap: 28px 20px; padding-bottom: 60px; }
.lib .summary { font-size: 14px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.used { color: var(--paper-2); }
.treat { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(360px, 100%), 1fr)); gap: 20px; padding: 28px 0 60px; }
.treat > div { border: 1px solid var(--ink-faint); padding: 24px; }
.treat > div.chosen { border-color: var(--paper-2); }
.treat h3 { font: 400 34px/1 var(--serif); margin: 10px 0; }
.treat ol { padding-left: 18px; color: var(--muted); }
.issues { padding-left: 18px; }
.issues li { margin: 6px 0; font-size: 14px; }
.issues .err { color: #ff7b7b; }
.empty { padding: 80px 0; font: 400 28px/1.3 var(--serif); color: var(--muted); }

/* shot list */
details.note summary { cursor: pointer; list-style: none; color: var(--paper-2); font: 500 14px var(--sans); padding: 4px 0; }
details.note summary::-webkit-details-marker { display: none; }
details.note p { margin-top: 8px; }
.prog { height: 3px; background: var(--ink-faint); margin-top: 22px; }
.prog i { display: block; height: 100%; background: var(--paper-2); }
.progl { color: var(--muted); font-size: 14px; margin-top: 8px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 0; }
.toggle { background: none; border: 1px solid var(--ink-faint); border-radius: 999px; color: var(--muted); font: 500 14px var(--sans); padding: 8px 14px; cursor: pointer; }
.toggle.on { border-color: var(--paper-2); color: var(--paper-2); }
.group-h { font: 600 11px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 32px 0 4px; }
.group-h.must { color: var(--paper-2); }
.match { font-size: 14px; color: var(--muted); margin-top: 10px; }
.match b { color: var(--ink); font-weight: 500; }
table.covt { width: 100%; border-collapse: collapse; margin-top: 16px; }
.covt th { font: 500 11px var(--sans); color: var(--muted); padding: 8px 4px; text-align: center; border-bottom: 1px solid var(--ink-faint); white-space: nowrap; }
.covt th.l, .covt td.l { text-align: left; }
.covt td { padding: 8px 4px; border-bottom: 1px solid var(--ink-faint); text-align: center; }
.covt .nm { font: 400 17px/1.2 var(--serif); }
.cell { display: inline-flex; width: 24px; height: 20px; align-items: center; justify-content: center; font: 500 11px var(--mono); }
.cell.have { background: rgba(87,101,255,.55); color: #fff; }
.cell.gap { color: var(--paper-2); }
.cell.none { color: var(--ink-faint); }

/* music */
.cues { display: flex; flex-direction: column; margin: 12px 0 0; }
.cue { border-top: 1px solid var(--ink-faint); padding: 24px 0 8px; }
.cue h3 { font: 400 28px/1.1 var(--serif); margin: 10px 0 4px; }
.trk { display: grid; grid-template-columns: 44px minmax(0, 1fr) 180px; gap: 14px; align-items: center; padding: 12px 0; }
.trk .t { font: 400 19px/1.2 var(--serif); }
.trk .a { font-size: 13px; color: var(--muted); margin-top: 2px; }
.trk .wy { font-size: 14px; color: var(--muted); margin-top: 4px; }
.trk.chosen .t::before { content: "● "; color: var(--paper-2); font-size: 13px; vertical-align: 2px; }
.pbtn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--ink-faint); background: none; color: var(--ink); cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; }
.pbtn.on { background: var(--paper-2); border-color: var(--paper-2); color: #000; }
.pbtn:disabled { opacity: .3; cursor: default; }
svg.wave { width: 100%; height: 28px; display: block; cursor: pointer; }
svg.wave path { fill: rgba(255,255,255,.14); }
svg.wave path.prog { fill: var(--paper-2); }
.lic.no { color: #ff7b7b; }
.refs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap: 20px; margin: 16px 0 0; }
.ref { border: 1px solid var(--ink-faint); padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.ref h3 { font: 400 22px/1.15 var(--serif); margin: 0; }
.credits { font: 12px/1.7 var(--mono); color: var(--muted); padding: 14px 0; white-space: pre-wrap; }
section.fold { margin-top: 44px; border-top: 1px solid var(--ink-faint); padding-top: 18px; }
section.fold > details > summary { cursor: pointer; list-style: none; font: 400 24px var(--serif); }
section.fold > details > summary::-webkit-details-marker { display: none; }
section.fold > details > summary span { font: 14px var(--sans); color: var(--muted); margin-left: 8px; }
footer { height: 60px; }

/* plan */
.moodcols { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 32px; }
ul.plain { list-style: none; margin: 8px 0 0; padding: 0; }
ul.plain li { padding: 6px 0; font-size: 15px; }
ol.arrive { margin: 10px 0 0; padding-left: 20px; }
ol.arrive li { padding: 5px 0; font-size: 15px; }
.lightsel { margin-top: 14px; background: #000; color: var(--ink); border: 1px solid var(--ink-faint); font: 15px var(--sans); padding: 9px 12px; }
.rcps { list-style: none; margin: 16px 0 0; padding: 0; }
.rcp { display: grid; grid-template-columns: 240px minmax(0, 1fr) 28px; gap: 20px; align-items: start; padding: 16px 0; border-top: 1px solid var(--ink-faint); }
.rcp .rn { font: 400 21px/1.2 var(--serif); }
.rcp .for { font: 12px var(--mono); color: var(--muted); margin-bottom: 6px; }
.rcp .wy { font-size: 13px; color: var(--muted); margin-top: 6px; }
.fallback { font-size: 13px; margin-top: 6px; color: var(--muted); }
.fallback b { color: var(--ink); font-weight: 500; }
.rcp .rn span { font: 13px var(--mono); color: var(--muted); margin-right: 8px; }
.rcp .how { font-size: 15px; margin-top: 6px; }
.rcp .spec { font-size: 13px; color: #c9ceff; margin-top: 6px; }
.rcp .spec .talent { color: var(--paper-2); }
.rcp input { accent-color: var(--paper-2); width: 20px; height: 20px; margin: 4px 0 0; }
.rcp.got .rn, .rcp.got .how { color: var(--muted); text-decoration: line-through; }
.rcp.got svg.sk { opacity: .4; }
svg.sk { display: block; width: 100%; aspect-ratio: 16/9; background: #0e0e10; stroke: rgba(255,255,255,.85); stroke-width: 1.3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
svg.sk * { vector-effect: non-scaling-stroke; }
svg.sk .ghost { opacity: .28; }
svg.sk .a { stroke: var(--paper-2); }
svg.sk .f { stroke: rgba(255,255,255,.35); }
.textbtn { background: none; border: 0; color: var(--muted); font: 14px var(--sans); padding: 16px 0; cursor: pointer; text-decoration: underline; }

/* player bar */
.player { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: rgba(0,0,0,.94); border-top: 1px solid var(--ink-faint); backdrop-filter: blur(8px); display: none; }
.player.show { display: block; }
.player .wrap { display: grid; grid-template-columns: 44px minmax(0, 260px) 1fr auto auto; gap: 16px; align-items: center; height: 68px; }
.player .t { font: 400 17px/1.15 var(--serif); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player .a { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player input[type=range] { width: 100%; accent-color: var(--paper-2); }
.player .tm { font: 12px var(--mono); color: var(--muted); }
body.playing-bar { padding-bottom: 68px; }

@media (hover: none) { .shot:hover .thumb { outline-color: transparent; } }
@media (max-width: 820px) {
  * { -webkit-tap-highlight-color: transparent; }
  body { -webkit-text-size-adjust: 100%; padding-bottom: calc(56px + env(safe-area-inset-bottom)); }
  .wrap { padding: 0 16px; }
  .desk { display: none !important; }
  header.top { padding-top: env(safe-area-inset-top); backdrop-filter: none; background: #000; }  /* a backdrop-filter would trap the fixed tab bar inside the header */
  header.top .wrap { height: 48px; gap: 12px; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; margin: 0; z-index: 25; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 0;
    background: rgba(0,0,0,.94); backdrop-filter: blur(8px); border-top: 1px solid var(--ink-faint); padding-bottom: env(safe-area-inset-bottom); }
  nav button { height: 56px; padding: 0; font-size: 10px; letter-spacing: .08em; border-bottom: 0; border-top: 2px solid transparent; }
  nav button.on { border-top-color: var(--paper-2); }
  nav .lg { display: none; } nav .sm { display: inline; }
  .live:not(.hosted) span { display: none; }
  .live span { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player { bottom: calc(56px + env(safe-area-inset-bottom)); }
  .player .wrap { grid-template-columns: 44px minmax(0, 1fr) auto; height: 64px; }
  .player .wrap > :nth-child(3), .player .wrap > :nth-child(4) { display: none; }
  body.playing-bar { padding-bottom: calc(120px + env(safe-area-inset-bottom)); }
  .drawer .in { padding: calc(14px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom)); }
  .drawer h3 { font-size: 26px; }
  .kv { grid-template-columns: 92px minmax(0, 1fr); gap: 8px 12px; }
  .hero { padding: 32px 0 24px; }
  .tone { grid-template-columns: 1fr; gap: 22px; margin-top: 28px; }
  .playrow .btn { flex: 1 1 100%; }
  .act { padding-top: 44px; }
  .shots, .lib { grid-template-columns: 1fr 1fr; gap: 20px 12px; }
  .shot .why { display: none; }
  .voline { font-size: 15px; }
  .page-title { font-size: 38px; margin-top: 28px; }
  .section-h { font-size: 26px; margin-top: 40px; }
  .moodcols { grid-template-columns: 1fr; }
  .rcp { grid-template-columns: minmax(0, 1fr) 24px; gap: 12px; padding: 20px 0; }
  .rcp svg.sk { grid-column: 1 / -1; }
  .rcp .rn { font-size: 18px; }
  .rcp .how { font-size: 14px; }
  .trk { grid-template-columns: 44px minmax(0, 1fr); }
  .trk svg.wave { grid-column: 2; }
  .toolbar input { min-width: 0; flex-basis: 100%; }
  .toolbar select { flex: 1 1 0; min-width: 0; }
  .animatic .keys { display: none; }
  .animatic #hudR { display: none; }
  .animatic .sub { bottom: 24px; font-size: 19px; padding: 0 6%; }
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand">STORIAN<b>.</b></div>
  <nav id="nav">
    <button data-tab="board" class="on"><span class="lg">Storyboard</span><span class="sm">Board</span></button>
    <button data-tab="plan">Plan</button>
    <button data-tab="shoot"><span class="lg">Shot list</span><span class="sm">Shoot</span></button>
    <button data-tab="music">Music</button>
    <button data-tab="lib">Library</button>
    <button data-tab="treat"><span class="lg">Treatments</span><span class="sm">Ideas</span></button>
    <button data-tab="checks" class="desk">Checks</button>
  </nav>
  <div class="spacer"></div>
  <div class="live" id="live"><i></i><span>live · your agent's edits appear here</span></div>
</div></header>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="pencil" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.6" xChannelSelector="R" yChannelSelector="G"/></filter>
  <g id="p"><circle cx="0" cy="-35" r="4" vector-effect="non-scaling-stroke"/><path d="M-4.5 -29.5 Q0 -31.5 4.5 -29.5 L6.5 -12 L-6.5 -12 Z M-3 -12 L-3.5 0 M3 -12 L3.5 0" vector-effect="non-scaling-stroke"/></g>
</defs></svg>
<main id="app"><div class="wrap empty">Loading…</div></main>

<div class="player" id="player"><div class="wrap">
  <button class="pbtn" id="pPlay" onclick="togglePlay()">▶</button>
  <div><div class="t" id="pTitle"></div><div class="a" id="pArtist"></div></div>
  <input type="range" id="pSeek" min="0" max="1000" value="0" oninput="AUDIO.duration && (AUDIO.currentTime = this.value / 1000 * AUDIO.duration)">
  <span class="tm" id="pTime">0:00</span>
  <button class="btn ghost" style="padding:8px 12px" onclick="stopPlay()">✕</button>
</div></div>

<aside class="drawer" id="drawer"><div class="in" id="drawerIn"></div></aside>

<div class="animatic" id="anim">
  <div class="stage" id="stage" onclick="tapStage(event)">
    <video id="animV" playsinline style="display:none"></video><img id="animI" alt="" style="display:none">
    <button class="aclose" onclick="event.stopPropagation();closeAnim()" title="close">✕</button>
    <div class="hud"><span id="hudL"></span><span id="hudR"></span></div>
    <div class="sub" id="sub"></div>
    <button class="score" id="scoreBtn" onclick="event.stopPropagation();toggleScore()"></button>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div class="keys">space pause · ← → shot · esc close · tap the edges to skip</div>
</div>

<script>
const TABS = ["board", "plan", "shoot", "music", "lib", "treat", "checks"];
let D = null, TAB = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "board", VERSION = 0;
const HOVER = matchMedia("(hover: hover)").matches;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = v => typeof v === "number" ? v : String(v).split(":").reduce((a, p) => a * 60 + parseFloat(p), 0);
const fmt = t => { t = Math.max(0, t); const m = Math.floor(t / 60), s = t - m * 60; return `${String(m).padStart(2, "0")}:${s.toFixed(1).padStart(4, "0")}`; };
const fmtLong = t => { const m = Math.floor(t / 60), s = Math.round(t - m * 60); return `${m}:${String(s).padStart(2, "0")}`; };

function frameUrl(clip, t) {
  const f = D.frames[clip];
  if (!f || !f.t.length) return "";
  let best = f.t[0];
  for (const x of f.t) { if (x <= t + 0.5) best = x; else break; }
  return `/media/frames/${clip}/t${best.toFixed(3).padStart(9, "0")}.jpg`;
}
function previewUrl(s) {
  const name = `${s.clip}_${num(s.in).toFixed(2)}_${num(s.out).toFixed(2)}.mp4`;
  return D.previews.includes(name) ? `/media/previews/${name}` : null;
}
function allShots() {
  const out = []; let t = 0, n = 0;
  for (const [ai, a] of (D.sequence?.acts || []).entries())
    for (const s of a.shots) {
      const dur = num(s.out) - num(s.in);
      out.push({ ...s, act: a, ai, idx: n++, at: t, dur }); t += dur;
    }
  return out;
}

async function load() {
  D = await (await fetch("/api/project")).json();
  render();
  liveLabel();
}
// hosted (storian publish): a snapshot that changes only when the laptop publishes again
function liveLabel(offline) {
  if (!D.hosted) return;
  $("#live").classList.add("hosted");
  const h = (Date.now() - Date.parse(D.hosted.published)) / 3.6e6;
  const ago = h < 1 ? `${Math.max(1, Math.round(h * 60))} min ago` : h < 48 ? `${Math.round(h)} h ago` : `${Math.round(h / 24)} days ago`;
  $("#live span").textContent = offline ? `offline · saved copy from ${ago}` : `published ${ago}`;
}
async function poll() {
  try {
    const { v } = await (await fetch("/api/version")).json();
    if (VERSION && v !== VERSION) {
      const y = scrollY; await load(); scrollTo(0, y);
      $("#live").classList.add("flash"); setTimeout(() => $("#live").classList.remove("flash"), 1200);
    }
    VERSION = v;
    liveLabel();
  } catch (e) { D && liveLabel(true); }
  setTimeout(poll, D?.hosted ? 60000 : 2000);
}

function render() {
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === TAB));
  const app = $("#app");
  if (TAB === "treat") app.innerHTML = renderTreatments();
  else if (TAB === "lib") { app.innerHTML = renderLibraryShell(); renderLibrary(); }
  else if (TAB === "checks") app.innerHTML = renderChecks();
  else if (TAB === "music") app.innerHTML = renderMusic();
  else if (TAB === "shoot") app.innerHTML = renderShoot();
  else if (TAB === "plan") app.innerHTML = renderPlan();
  else app.innerHTML = renderBoard();
  bindShots();
  syncPlayButtons();
}

/* ---------------- storyboard */
function renderBoard() {
  const S = D.sequence;
  if (!S) {
    const st = D.story;
    return `<div class="wrap empty">No sequence yet.<br><span class="lede">${st ? "Treatments are ready. Pick one in the Ideas tab and tell your agent." : "Ask your agent to run the storian pipeline (storian status shows the next step)."}</span>${shootLink()}</div>`;
  }
  const shots = allShots();
  const total = shots.reduce((a, s) => a + s.dur, 0);
  const intent = [["Central idea", S.central_idea], ["Motif", S.motif], ["Music", S.music], ["Style & pacing", S.style_notes]].filter(x => x[1]);
  let html = `<div class="wrap">
  <section class="hero">
    <div class="micro">${esc(D.config.name)}</div>
    <h1>${esc(S.title)}</h1>
    ${S.logline ? `<p class="logline">${esc(S.logline)}</p>` : ""}
    <dl class="tone"><div><dt>Mood</dt><dd>${esc(D.mood?.mood || S.mood || "not set")}</dd></div><div><dt>Theme</dt><dd>${esc(D.mood?.theme || S.theme || "not set")}</dd></div></dl>
    ${intent.length ? `<details class="more"><summary>Director's intent</summary><dl class="kv">${intent.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl></details>` : ""}
    <div class="playrow"><button class="btn" onclick="openAnim(0)">▶ Play animatic</button><span class="facts">${fmtLong(total)} · ${shots.length} shots · ${S.acts.length} acts</span></div>
    ${shootLink()}
  </section>`;
  for (const [ai, a] of S.acts.entries()) {
    const as = shots.filter(s => s.ai === ai);
    const start = as[0]?.at || 0, d = as.reduce((x, s) => x + s.dur, 0);
    html += `<section class="act" id="act-${ai}">
      <div class="act-head"><div class="micro">Act ${ai + 1} · ${fmtLong(start)}–${fmtLong(start + d)}</div><h2>${esc(a.title)}</h2>${a.purpose ? `<p class="purpose">${esc(a.purpose)}</p>` : ""}</div>
      ${a.vo ? `<details class="vo"><summary>Voiceover +</summary><p>${esc(a.vo)}</p></details>` : ""}
      <div class="shots">${as.map(shotCard).join("")}</div></section>`;
  }
  return html + `</div><footer></footer>`;
}
function shootLink() {
  const shots = D.coverage?.shots || [];
  if (!shots.length) return "";
  const left = shots.filter(s => !isGot(gotKey("film", s))).length;
  return `<a class="nextlink" href="#shoot"><b>Shot list</b><span>${left === shots.length ? `${left} shots to get` : `${left} of ${shots.length} still to get`} →</span></a>`;
}

/* ---------------- shots to get: one list for the whole film (shot list) and one per kind of place (plan) */
const SIZE_WORD = { EWS: "very wide", WS: "wide", MWS: "medium wide", MS: "medium", MCU: "medium close", CU: "close-up", ECU: "extreme close-up", insert: "insert" };
const SUBJ_LABEL = { none: "no one in frame", unrecognizable: "stand-in is fine", talent: "needs the model" };
const HEIGHT_WORD = { low: "from low", eye: "eye level", high: "from high", overhead: "overhead" };
const hashStr = s => { let h = 5381; for (const c of String(s)) h = (h * 33 ^ c.charCodeAt(0)) >>> 0; return h.toString(36); };
const gotKey = (list, s) => `storian:got:${D.config.name}:${list}:${hashStr(s.name)}`;
const isGot = k => { try { return localStorage.getItem(k) === "1"; } catch (e) { return false; } };
function toggleGot(k, el) {
  try { el.checked ? localStorage.setItem(k, "1") : localStorage.removeItem(k); } catch (e) {}
  rerender();
}
function sketch(s) {  // the agent's pencil lines; anything that could run script is dropped
  const sk = s.sketch && !/<\s*script|\son\w+\s*=|javascript:/i.test(s.sketch) ? s.sketch : "";
  return `<svg class="sk" viewBox="0 0 160 90" aria-hidden="true"><g class="ghost" transform="translate(.7 .5)">${sk}</g><g filter="url(#pencil)">${sk}</g></svg>`;
}
function shotLi(s, key, n) {
  const on = isGot(key);
  const spec = [HEIGHT_WORD[s.height], SIZE_WORD[s.size] || s.size, s.focal && s.focal !== "normal" && `${s.focal} lens`,
    s.move && !["static", "handheld-still"].includes(s.move) && s.move, s.secs && `${s.secs} s`].filter(Boolean).map(esc);
  if (s.subject) spec.push(`<span class="${esc(s.subject)}">${esc(SUBJ_LABEL[s.subject] || s.subject)}</span>`);
  return `<li class="rcp ${on ? "got" : ""}">${sketch(s)}<div>${s.for ? `<div class="for">${esc(s.for)}</div>` : ""}
    <div class="rn">${n ? `<span>${n}</span>` : ""}${esc(s.name)}</div>
    ${s.how ? `<div class="how">${esc(s.how)}</div>` : ""}${spec.length ? `<div class="spec">${spec.join(" · ")}</div>` : ""}
    ${s.why ? `<div class="wy">${esc(s.why)}</div>` : ""}
    ${s.fallback ? `<div class="fallback"><b>Without the model:</b> ${esc(s.fallback)}</div>` : ""}</div>
    <input type="checkbox" ${on ? "checked" : ""} onclick="toggleGot('${key}', this)" aria-label="got it"></li>`;
}

/* ---------------- shot list: what the film still needs. Old scenes can't be finished (the light,
   weather and outfits won't match), so every shot here can be shot on any day, somewhere similar */
let COV_SOLO = false, SHOOT_HIDE = false;
function renderShoot() {
  const C = D.coverage, shots = C?.shots || [];
  if (!shots.length) return `<div class="wrap empty">No shot list yet.<br><span class="lede">Ask your agent for a coverage review (storian knowledge coverage).</span></div>`;
  const all = shots.filter(s => !COV_SOLO || s.subject !== "talent" || s.fallback);
  const got = all.filter(s => isGot(gotKey("film", s))).length;
  const show = s => !SHOOT_HIDE || !isGot(gotKey("film", s));
  const group = (title, xs, must) => xs.length ? `<div class="group-h ${must ? "must" : ""}">${title}</div><ol class="rcps">${xs.map(s => shotLi(s, gotKey("film", s))).join("")}</ol>` : "";
  return `<div class="wrap"><h1 class="page-title">Shot list</h1>
    ${C.summary ? `<details class="note"><summary>Director's note +</summary><p class="lede">${esc(C.summary)}</p></details>` : ""}
    <div class="prog"><i style="width:${all.length ? 100 * got / all.length : 0}%"></i></div>
    <div class="progl">${got} of ${all.length} got</div>
    <div class="filters"><button class="toggle ${COV_SOLO ? "on" : ""}" onclick="COV_SOLO=!COV_SOLO;rerender()">${COV_SOLO ? "✓ " : ""}Without the model</button><button class="toggle ${SHOOT_HIDE ? "on" : ""}" onclick="SHOOT_HIDE=!SHOOT_HIDE;rerender()">${SHOOT_HIDE ? "✓ " : ""}Hide what I got</button></div>
    ${group("Must get", all.filter(s => (s.priority || 3) === 1 && show(s)), true)}
    ${group("When you can", all.filter(s => (s.priority || 3) > 1 && show(s)))}
    ${C.scenes.length ? `<section class="fold desk"><details><summary>Coverage matrix <span>usable clips per scene</span></summary>${renderMatrix(C.scenes)}</details></section>` : ""}
    <footer></footer></div>`;
}
const COLS = [["wide", "Wide"], ["medium", "Med"], ["close", "Close"], ["detail", "Detail"],
  ["wide_lens", "Wide lens"], ["normal", "Normal"], ["tele", "Tele"], ["angle", "Angle"], ["moving", "Moving"], ["people", "People"], ["in_out", "In/out"]];
const GAP_COL = { "no-establishing": "wide", "no-wide": "wide", "no-medium": "medium", "no-close": "close", "no-detail": "detail",
  "one-focal-tele": "wide_lens", "one-focal-wide": "tele", "no-tele": "tele", "flat-angle": "angle", "no-movement": "moving",
  "no-people": "people", "no-in-out": "in_out", "thin": "*", "unusable": "*" };
const IMPORTANCE = { core: 0, support: 1, minor: 2 };
function renderMatrix(scenes) {
  const rows = [...scenes].sort((a, b) => IMPORTANCE[a.importance] - IMPORTANCE[b.importance] || b.score - a.score).map(sc => {
    const flags = new Set(sc.gaps.map(g => GAP_COL[g.code]));
    return `<tr><td class="l"><div class="nm" title="${esc(sc.verdict)}">${esc(sc.name)}</div></td>${COLS.map(([k]) => {
      const v = sc.counts[k] || 0, cls = v ? "have" : flags.has(k) || flags.has("*") ? "gap" : "none";
      return `<td><span class="cell ${cls}" title="${k}: ${v} usable">${v || (cls === "gap" ? "+" : "·")}</span></td>`; }).join("")}</tr>`;
  }).join("");
  return `<table class="covt"><tr><th class="l">Scene</th>${COLS.map(([, l]) => `<th>${l}</th>`).join("")}</tr>${rows}</table>
    <p class="muted" style="font-size:13px">Numbers are usable clips. <span style="color:var(--paper-2)">+</span> is a gap the rules see.</p>`;
}

/* ---------------- plan: the mood, and what to shoot on arrival somewhere new */
let PLAN_PLACE = null, PLAN_LIGHT = "";
function planReset(place) {
  for (const s of D.mood.places.find(x => x.id === place).shots) try { localStorage.removeItem(gotKey(place, s)); } catch (e) {}
  rerender();
}
function renderPlan() {
  const M = D.mood;
  if (!M) return `<div class="wrap empty">Set the mood first.<br><span class="lede">Tell your agent how the film should feel and what it's about. The music and every shot follow from it.</span></div>`;
  const places = M.places || [], pl = places.find(x => x.id === PLAN_PLACE) || places[0];
  const light = (M.light || []).find(x => x.name === PLAN_LIGHT);
  const list = (title, xs, must) => xs?.length ? `<div><div class="group-h ${must ? "must" : ""}">${title}</div><ul class="plain">${xs.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : "";
  let recipe = "";
  if (pl) {
    const shots = pl.shots || [], got = shots.filter(s => isGot(gotKey(pl.id, s))).length;
    recipe = `${pl.intro ? `<p class="lede" style="margin-top:18px">${esc(pl.intro)}</p>` : ""}
      ${(M.light || []).length ? `<select class="lightsel" onchange="PLAN_LIGHT=this.value;rerender()"><option value="">Light: any</option>${M.light.map(l => `<option ${l.name === PLAN_LIGHT ? "selected" : ""}>${esc(l.name)}</option>`).join("")}</select>` : ""}
      ${light ? `<div class="match"><b>${esc(light.name)}</b> · ${esc(light.tip)}</div>` : ""}
      <div class="prog"><i style="width:${shots.length ? 100 * got / shots.length : 0}%"></i></div><div class="progl">${got} of ${shots.length} got</div>
      <ol class="rcps">${shots.map((s, i) => shotLi(s, gotKey(pl.id, s), i + 1)).join("")}</ol>
      ${got ? `<button class="textbtn" onclick="planReset('${esc(pl.id)}')">Start over for the next ${esc(pl.name.toLowerCase())}</button>` : ""}`;
  }
  return `<div class="wrap"><h1 class="page-title">Plan</h1>
    <dl class="tone"><div><dt>Mood</dt><dd>${esc(M.mood)}</dd></div><div><dt>Theme</dt><dd>${esc(M.theme)}</dd></div></dl>
    <div style="margin-top:20px">${clampP(M.feel)}</div>
    ${M.shots?.length || M.music ? `<details class="more"><summary>How this mood looks and sounds</summary>
      <div class="moodcols">${list("Lean on", M.shots, true)}${list("Avoid", M.avoid)}</div>
      ${M.music ? `<div class="match" style="font-size:15px"><b>Music</b> · ${esc(M.music)}</div>` : ""}</details>` : ""}
    ${places.length ? `<h2 class="section-h">New location</h2><p class="lede">Pick the kind of place and shoot down the list, top to bottom.</p>
      ${(M.arrive || []).length ? `<details class="more"><summary>The first 10 minutes anywhere</summary><ol class="arrive">${M.arrive.map(x => `<li>${esc(x)}</li>`).join("")}</ol></details>` : ""}
      <div class="filters">${places.map(x => `<button class="toggle ${x === pl ? "on" : ""}" onclick="PLAN_PLACE='${esc(x.id)}';rerender()">${esc(x.name)}</button>`).join("")}</div>${recipe}` : ""}
    ${(M.errors || []).length ? `<ul class="issues">${M.errors.map(e => `<li class="err">${esc(e)}</li>`).join("")}</ul>` : ""}
    <footer></footer></div>`;
}

function rerender() { const y = scrollY; render(); scrollTo(0, y); }

function shotCard(s) {
  const L = D.labels[s.clip] || {};
  const pv = previewUrl(s);
  return `<article class="shot" data-idx="${s.idx}">
    <div class="thumb" ${pv ? `data-pv="${pv}"` : ""}><img loading="lazy" src="${frameUrl(s.clip, num(s.in) + 0.3)}" alt=""><span class="tag dur">${s.dur.toFixed(1)}s</span></div>
    <div class="meta"><div class="sid">${esc(s.id)} · ${fmtLong(s.at)}</div>
      ${s.vo_line ? `<div class="voline">“${esc(s.vo_line)}”</div>` : ""}
      <div class="why">${esc(s.why || L.summary || "")}</div></div></article>`;
}

function bindShots() {
  document.querySelectorAll(".shot[data-idx]").forEach(el => {
    const th = $(".thumb", el);
    el.addEventListener("click", () => openShot(+el.dataset.idx));
    if (HOVER && th?.dataset.pv) {
      let v;
      el.addEventListener("mouseenter", () => {
        if (!v) { v = document.createElement("video"); v.src = th.dataset.pv; v.muted = true; v.loop = true; v.playsInline = true; th.insertBefore(v, th.children[1]); }
        v.currentTime = 0; v.play().then(() => th.classList.add("playing")).catch(() => {});
      });
      el.addEventListener("mouseleave", () => { th.classList.remove("playing"); v && v.pause(); });
    }
  });
  document.querySelectorAll(".lib .shot[data-clip]").forEach(el => el.addEventListener("click", () => openClip(el.dataset.clip)));
}

function labelKV(L) {
  const rows = [["summary", L.summary], ["location", L.location], ["action", L.action], ["time", L.time_of_day],
    ["shot", [L.shot_size, L.focal_feel, L.angle, L.camera_move].filter(Boolean).join(" · ")],
    ["composition", L.composition], ["light", L.light], ["mood", (L.mood || []).join(", ")],
    ["story role", (L.story_role || []).join(", ")], ["audio", L.audio], ["quality", L.quality ? "★".repeat(L.quality) + "☆".repeat(5 - L.quality) : ""],
    ["issues", (L.issues || []).join(", ")], ["tags", (L.tags || []).join(", ")]];
  return `<dl class="kv">${rows.filter(r => r[1]).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`;
}
function momentsHTML(L) {
  return (L.moments || []).length ? `<div class="micro" style="margin-top:20px">Moments</div><div class="moments">${L.moments.map(m =>
    `<div><span class="mono">${fmt(m.in)}–${fmt(m.out)}</span>${"★".repeat(m.score || 0)} ${esc(m.desc)}${m.match_action ? ` <span class="muted">· match: ${esc(m.match_action)}</span>` : ""}</div>`).join("")}</div>` : "";
}
function openShot(i) {
  const s = allShots()[i]; const L = D.labels[s.clip] || {}; const c = D.clips[s.clip] || {};
  const pv = previewUrl(s);
  document.querySelectorAll(".shot.sel").forEach(e => e.classList.remove("sel"));
  document.querySelector(`.shot[data-idx="${i}"]`)?.classList.add("sel");
  const tc = `${s.clip}  ${fmt(num(s.in))} → ${fmt(num(s.out))}`;
  $("#drawerIn").innerHTML = `<button class="btn ghost close" onclick="closeDrawer()">✕</button>
    <div class="micro">${esc(s.id)} · Act ${s.ai + 1} · ${fmtLong(s.at)}</div>
    <h3>${esc(s.clip)}</h3>
    ${pv ? `<video src="${pv}" controls autoplay playsinline></video>` : `<img class="still" src="${frameUrl(s.clip, num(s.in) + 0.3)}">`}
    ${s.vo_line ? `<p class="voline" style="margin:16px 0 0">“${esc(s.vo_line)}”</p>` : ""}
    <p style="margin:14px 0 0">${esc(s.why || "")}</p>
    <dl class="kv"><dt>In / out</dt><dd><span class="copy" title="copy" onclick="navigator.clipboard.writeText('${tc}')">${fmt(num(s.in))} → ${fmt(num(s.out))}</span> (${s.dur.toFixed(1)}s)</dd>
      ${s.cut ? `<dt>Cut</dt><dd>${esc(s.cut)}</dd>` : ""}</dl>
    <details class="more"><summary>Clip log</summary>${labelKV(L)}${momentsHTML(L)}
      <dl class="kv"><dt>camera</dt><dd>${esc([c.camera, c.lens, c.gamma, c.fps && c.fps + " fps"].filter(Boolean).join(" · "))}</dd>
      <dt>file</dt><dd class="mono" style="font-size:12px;word-break:break-all">${esc(c.path)}</dd></dl>
      <img class="sheet" src="/media/sheets/${s.clip}.jpg"></details>
    <div class="drow"><button class="btn ghost" onclick="openShot(${Math.max(0, i - 1)})">← prev</button><button class="btn ghost" onclick="openShot(${Math.min(allShots().length - 1, i + 1)})">next →</button><button class="btn" onclick="closeDrawer();openAnim(${i})">▶ play from here</button></div>`;
  $("#drawer").classList.add("open"); $("#drawer").scrollTop = 0;
}
function openClip(id) {
  const L = D.labels[id] || {}; const c = D.clips[id] || {};
  const uses = allShots().filter(s => s.clip === id);
  $("#drawerIn").innerHTML = `<button class="btn ghost close" onclick="closeDrawer()">✕</button>
    <div class="micro">${c.duration?.toFixed(1)}s · ${esc(c.recorded_at || "")}</div><h3>${esc(id)}</h3>
    <img class="sheet" src="/media/sheets/${id}.jpg">
    ${uses.length ? `<p class="used mono">used in ${uses.map(s => s.id).join(", ")}</p>` : ""}
    ${labelKV(L)}${momentsHTML(L)}
    <dl class="kv"><dt>file</dt><dd class="mono" style="font-size:12px;word-break:break-all">${esc(c.path)}</dd></dl>`;
  $("#drawer").classList.add("open"); $("#drawer").scrollTop = 0;
}
function closeDrawer() { $("#drawer").classList.remove("open"); $("#drawer video")?.pause(); }

/* ---------------- music */
const AUDIO = new Audio(); AUDIO.preload = "none";
let NOW = null;  // {src, title, artist}
const mclock = t => { t = Math.max(0, t || 0); return `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`; };
function trackSrc(t) { if (t.file) return `/media/music/${t.file}`; return t.preview && !t.hotlink_blocked ? t.preview : null; }
function playSrc(src, title, artist, start = 0) {
  if (!src) return;
  if (NOW && NOW.src === src) { togglePlay(); return; }
  NOW = { src, title, artist }; AUDIO.src = src; AUDIO.currentTime = start;
  AUDIO.play().catch(() => {});
  $("#pTitle").textContent = title || ""; $("#pArtist").textContent = artist || "";
  $("#player").classList.add("show"); document.body.classList.add("playing-bar");
}
function playTrack(id, start = 0) {
  const M = D.music; const t = (M.tracks || []).find(x => x.id === id) || (M.references || []).find(x => x.id === id);
  if (t) playSrc(trackSrc(t), t.title, [t.artist, t.source, t.license].filter(Boolean).join(" · "), start);
}
function togglePlay() { AUDIO.paused ? AUDIO.play().catch(() => {}) : AUDIO.pause(); }
function stopPlay() { AUDIO.pause(); NOW = null; $("#player").classList.remove("show"); document.body.classList.remove("playing-bar"); syncPlayButtons(); }
function syncPlayButtons() {
  const on = NOW && !AUDIO.paused ? NOW.src : null;
  $("#pPlay").textContent = AUDIO.paused ? "▶" : "❚❚";
  document.querySelectorAll(".pbtn[data-src]").forEach(b => { const me = b.dataset.src === on; b.classList.toggle("on", me); b.textContent = me ? "❚❚" : "▶"; });
}
AUDIO.addEventListener("play", syncPlayButtons); AUDIO.addEventListener("pause", syncPlayButtons);
AUDIO.addEventListener("timeupdate", () => {
  const d = AUDIO.duration || 0, f = d ? AUDIO.currentTime / d : 0;
  $("#pSeek").value = Math.round(f * 1000); $("#pTime").textContent = `${mclock(AUDIO.currentTime)} / ${mclock(d)}`;
  document.querySelectorAll("svg.wave").forEach(w => { const pr = w.querySelector(".prog"); if (pr) pr.style.clipPath = w.dataset.src === NOW?.src ? `inset(0 ${100 - f * 100}% 0 0)` : "inset(0 100% 0 0)"; });
});
function wave(item) {
  const a = item.analysis || {}, pk = a.peaks?.length ? a.peaks : null, src = trackSrc(item);
  if (!pk) return a.energy?.length ? spark(a.energy) : "";
  const n = pk.length, h = 34, w = 400;
  const d = pk.map((v, i) => `M${(i * w / n).toFixed(1)} ${(h / 2 - v * h / 2).toFixed(1)}v${Math.max(1, v * h).toFixed(1)}h${(w / n * 0.6).toFixed(2)}v-${Math.max(1, v * h).toFixed(1)}z`).join("");
  return `<svg class="wave" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" data-src="${esc(src)}" onclick="seekWave(event, this)"><path d="${d}"/><path class="prog" d="${d}" style="clip-path:inset(0 100% 0 0)"/></svg>`;
}
function spark(e) {
  const w = 400, h = 34, pts = e.map((v, i) => `${(i / (e.length - 1) * w).toFixed(1)},${(h - v * (h - 2) - 1).toFixed(1)}`).join(" ");
  return `<svg class="wave" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--ink-soft)" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}
function seekWave(e, el) {
  if (el.dataset.src !== NOW?.src || !AUDIO.duration) return;
  const r = el.getBoundingClientRect(); AUDIO.currentTime = (e.clientX - r.left) / r.width * AUDIO.duration;
}
function pbtn(item) { const src = trackSrc(item); return `<button class="pbtn" ${src ? `data-src="${esc(src)}"` : `disabled title="not cached yet: ask your agent to run storian music fetch"`} onclick="playTrack('${esc(item.id)}')">▶</button>`; }
function trackMeta(t) {
  const a = t.analysis || {};
  return [t.artist, t.bpm || a.bpm ? `${Math.round(t.bpm || a.bpm)} bpm` : null, t.duration ? mclock(t.duration) : null].filter(Boolean).map(esc).join(" · ");
}
function licBadge(t) { return t.youtube_ok === false ? ` · <span class="lic no">${esc(t.license || "licence")}: not for a monetised video</span>` : ""; }
const fold = (title, note, body) => `<section class="fold"><details><summary>${title}${note ? ` <span>${note}</span>` : ""}</summary>${body}</details></section>`;
const clampP = text => text ? `<p class="lede clamp" onclick="this.classList.toggle('clamp')">${esc(text)}</p>` : "";

function renderMusic() {
  const M = D.music;
  if (!M) return `<div class="wrap empty">No music yet.<br><span class="lede">Give your agent a few tracks you like (files or links), or ask it to find music for the cut (storian knowledge music).</span></div>`;
  const tracks = Object.fromEntries((M.tracks || []).map(t => [t.id, t]));
  const acts = D.sequence?.acts || [];
  const shots = allShots();
  const actStart = i => shots.find(s => s.ai === i)?.at || 0;
  const usedIn = {}; (M.cues || []).forEach(c => (c.candidates || []).forEach(x => (usedIn[x.track] ||= []).push(c.id)));
  const chosen = (M.cues || []).map(c => tracks[c.chosen]).filter(Boolean);
  const trk = (t, why, on) => `<div class="trk ${on ? "chosen" : ""}">${pbtn(t)}<div><div class="t">${esc(t.title)}</div><div class="a">${trackMeta(t)}${licBadge(t)}</div>${why ? `<div class="wy">${esc(why)}</div>` : ""}</div>${wave(t)}</div>`;
  const refs = (M.references || []).map(r => `<div class="ref"><div class="micro">Reference</div><h3>${esc(r.title)}</h3>
      ${r.notes ? `<div class="voline" style="font-size:16px">“${esc(r.notes)}”</div>` : r.describe ? `<div class="why">${esc(r.describe)}</div>` : ""}
      ${wave(r)}
      <div style="display:flex;gap:12px;align-items:center">${r.file ? pbtn(r) : ""}<span class="why">${[r.analysis?.bpm && r.analysis.bpm + " bpm", r.duration && mclock(r.duration)].filter(Boolean).join(" · ")}</span>${r.url ? `<a class="why" href="${esc(r.url)}" target="_blank" rel="noopener">open ↗</a>` : ""}</div></div>`).join("");
  const cues = (M.cues || []).map((c, ci) => {
    const a0 = Math.min(...(c.acts || [0])), names = (c.acts || []).map(i => acts[i] ? acts[i].title : `act ${i + 1}`);
    const secs = M.cue_seconds?.[c.id] || 0;
    const feel = [c.mood, c.tempo].filter(Boolean).map(esc).join(" · ");
    return `<section class="cue"><div class="micro">Cue ${ci + 1} · ${fmtLong(actStart(a0))} · ${fmtLong(secs)} long${c.vo ? " · under voiceover" : ""}</div>
      <h3>${esc(c.title || names.join(", "))}</h3><div class="why">${c.title ? esc(names.join(", ")) + (feel ? " · " : "") : ""}${feel}</div>
      ${(c.candidates || []).map(x => tracks[x.track] ? trk(tracks[x.track], x.why, c.chosen === x.track) : "").join("") || `<div class="why">No candidates yet.</div>`}</section>`;
  }).join("");
  const lib = (M.tracks || []).map(t => trk(t, usedIn[t.id] ? `in ${usedIn[t.id].join(", ")}` : "")).join("");
  const credits = chosen.filter(t => t.attribution).map(t => t.attribution).join("\n");
  return `<div class="wrap"><h1 class="page-title">Music</h1>
    ${clampP(M.direction || D.sequence?.music)}
    ${(M.cues || []).some(c => c.chosen && tracks[c.chosen] && trackSrc(tracks[c.chosen])) ? `<div class="playrow" style="margin-top:22px"><button class="btn" onclick="SCORE=true;openAnim(0)">▶ Play animatic with this music</button></div>` : ""}
    ${(M.references || []).length ? `<h2 class="section-h">Your references</h2><div class="refs">${refs}</div>` : ""}
    <h2 class="section-h">Cues</h2><p class="lede">One piece of music per stretch of the film. ● is the current pick.</p>
    <div class="cues">${cues || `<div class="why">No cues yet.</div>`}</div>
    ${lib ? fold("All tracks", (M.tracks || []).length, lib) : ""}
    ${credits ? fold("Credits", "paste into the YouTube description", `<div class="credits">${esc(credits)}</div>`) : ""}
    ${(M.errors || []).length ? `<ul class="issues">${M.errors.map(e => `<li class="err">${esc(e)}</li>`).join("")}</ul>` : ""}<footer></footer></div>`;
}

/* temp music under the animatic: each act plays its cue's chosen track */
let SCORE = true, SCORE_CUE = null;
function cueForAct(ai) {
  return (D.music?.cues || []).find(c => (c.acts || []).includes(ai) && c.chosen && trackSrc((D.music.tracks || []).find(t => t.id === c.chosen) || {}));
}
function acts_scored() { return (D.sequence?.acts || []).some((_, i) => cueForAct(i)); }
function toggleScore() { SCORE = !SCORE; SCORE_CUE = null; if (!SCORE) AUDIO.pause(); playAt(A.i); }
function scoreAt(s) {
  const btn = $("#scoreBtn"), has = acts_scored();
  btn.style.display = has ? "" : "none"; btn.classList.toggle("on", SCORE); btn.textContent = SCORE ? "♪ temp music on" : "♪ temp music off";
  if (!has || !SCORE) return false;
  const cue = cueForAct(s.ai);
  if (!cue) { AUDIO.pause(); SCORE_CUE = null; return false; }
  const first = A.shots.find(x => (cue.acts || []).includes(x.ai)), want = (cue.start || 0) + s.at - first.at;
  const t = D.music.tracks.find(x => x.id === cue.chosen), src = trackSrc(t);
  if (SCORE_CUE !== cue.id || NOW?.src !== src) {
    SCORE_CUE = cue.id; NOW = { src, title: t.title, artist: t.artist }; AUDIO.src = src;
    AUDIO.addEventListener("loadedmetadata", () => { AUDIO.currentTime = want; }, { once: true });
  } else if (Math.abs(AUDIO.currentTime - want) > 1.5) AUDIO.currentTime = want;
  AUDIO.play().catch(() => {});
  return true;
}

/* ---------------- animatic */
let A = { i: 0, timer: null, paused: false, shots: [], sub: "" };
function openAnim(i) { A.shots = allShots(); $("#anim").classList.add("open"); playAt(i); }
function closeAnim() {
  clearTimeout(A.timer); if (SCORE_CUE) { AUDIO.pause(); SCORE_CUE = null; }
  const v = $("#animV"); v.pause(); v.removeAttribute("src"); v.style.display = $("#animI").style.display = "none";
  $("#anim").classList.remove("open");
}
function tapStage(e) {
  const x = e.clientX / innerWidth;
  x < 0.3 ? playAt(A.i - 1) : x > 0.7 ? playAt(A.i + 1) : togglePause();
}
function playAt(i) {
  clearTimeout(A.timer);
  if (i >= A.shots.length) return closeAnim();
  A.i = Math.max(0, i); A.paused = false;
  const s = A.shots[A.i], total = A.shots.at(-1).at + A.shots.at(-1).dur;
  const pv = previewUrl(s), v = $("#animV"), img = $("#animI");
  const scored = scoreAt(s);
  if (pv) {
    img.style.display = "none"; v.style.display = "";
    v.muted = scored; v.src = pv; v.onended = () => playAt(A.i + 1);
    v.play().catch(() => { v.muted = true; v.play().catch(() => {}); });
  } else {
    v.pause(); v.removeAttribute("src"); v.style.display = "none";
    img.style.display = ""; img.src = frameUrl(s.clip, num(s.in) + 0.3);
    A.timer = setTimeout(() => playAt(A.i + 1), s.dur * 1000);
  }
  if (s.vo_line) A.sub = s.vo_line; else if (s.role !== "vo") A.sub = "";
  $("#sub").textContent = A.sub ? `“${A.sub}”` : "";
  $("#hudL").textContent = `${String(s.ai + 1).padStart(2, "0")} ${s.act.title}`;
  $("#hudR").textContent = `${s.id} · ${s.clip} ${fmt(num(s.in))}–${fmt(num(s.out))} · ${fmt(s.at)} / ${fmt(total)}`;
  $("#bar").style.width = `${100 * s.at / total}%`;
  const nxt = A.shots[A.i + 1] && previewUrl(A.shots[A.i + 1]);
  if (nxt) { const pre = document.createElement("link"); pre.rel = "preload"; pre.as = "video"; pre.href = nxt; document.head.appendChild(pre); }
}
function togglePause() {
  const v = $("#animV");
  if (v.getAttribute("src")) { v.paused ? v.play() : v.pause(); if (SCORE_CUE) v.paused ? AUDIO.pause() : AUDIO.play().catch(() => {}); }
  else if (A.timer) { clearTimeout(A.timer); A.timer = null; } else playAt(A.i + 1);
}
document.addEventListener("keydown", e => {
  if ($("#anim").classList.contains("open")) {
    if (e.key === "Escape") closeAnim();
    else if (e.key === " ") { e.preventDefault(); togglePause(); }
    else if (e.key === "ArrowRight") playAt(A.i + 1);
    else if (e.key === "ArrowLeft") playAt(A.i - 1);
  } else if (e.key === "Escape") closeDrawer();
});

/* ---------------- treatments */
function renderTreatments() {
  const st = D.story;
  if (!st) return `<div class="wrap empty">No treatments yet. Your agent writes them to story.json after labeling.</div>`;
  return `<div class="wrap"><h1 class="page-title">Treatments</h1>
    ${clampP(st.footage_summary)}
    <div class="treat">${(st.options || []).map((o, i) => `<div class="${st.chosen === i ? "chosen" : ""}">
      <div class="micro">${st.chosen === i ? '<span style="color:var(--paper-2)">● Chosen</span>' : `Option ${i + 1}`}</div>
      <h3>${esc(o.title)}</h3><p style="font:italic 19px/1.4 var(--serif);color:var(--muted);margin:0">${esc(o.logline)}</p>
      <dl class="kv"><dt>Mood</dt><dd>${esc(o.mood)}</dd><dt>Theme</dt><dd>${esc(o.theme)}</dd></dl>
      <details class="more"><summary>More</summary>
        <p>${esc(o.central_idea)}</p>
        <dl class="kv"><dt>Motif</dt><dd>${esc(o.motif)}</dd><dt>Music</dt><dd>${esc(o.music)}</dd></dl>
        <ol>${(o.arc || []).map(x => `<li>${esc(x)}</li>`).join("")}</ol>
        ${(o.sample_vo || []).map(x => `<div class="voline" style="margin:6px 0">“${esc(x)}”</div>`).join("")}
        <p class="why" style="margin-top:14px">${esc(o.footage_fit || "")}</p></details></div>`).join("")}</div>
    ${st.human_notes ? `<p class="lede">Notes: ${esc(st.human_notes)}</p>` : ""}</div>`;
}

/* ---------------- library */
function renderLibraryShell() {
  const sizes = [...new Set(Object.values(D.labels).map(l => l.shot_size).filter(Boolean))].sort();
  const n = Object.keys(D.clips).length;
  return `<div class="wrap"><h1 class="page-title">Library</h1><p class="lede">${n} clips. Tap one for its full log.</p>
    <div class="toolbar"><input id="q" placeholder="Search: tram, night, hands, food…" oninput="renderLibrary()">
    <select id="fs" onchange="renderLibrary()"><option value="">Any size</option>${sizes.map(s => `<option value="${esc(s)}">${esc(SIZE_WORD[s] || s)}</option>`).join("")}</select>
    <select id="fq" onchange="renderLibrary()"><option value="0">Any quality</option><option value="4">★★★★+</option><option value="5">★★★★★</option></select>
    <select id="fu" onchange="renderLibrary()"><option value="">All</option><option value="used">In the cut</option><option value="unused">Not used</option></select></div>
    <div class="lib" id="lib"></div></div>`;
}
function renderLibrary() {
  const q = ($("#q")?.value || "").toLowerCase(), fs = $("#fs")?.value, fq = +($("#fq")?.value || 0), fu = $("#fu")?.value;
  const used = {}; allShots().forEach(s => (used[s.clip] ||= []).push(s.id));
  const ids = Object.keys(D.clips).filter(id => {
    const L = D.labels[id] || {};
    if (fs && L.shot_size !== fs) return false;
    if (fq && (L.quality || 0) < fq) return false;
    if (fu === "used" && !used[id]) return false;
    if (fu === "unused" && used[id]) return false;
    return !q || (id + JSON.stringify(L)).toLowerCase().includes(q);
  });
  $("#lib").innerHTML = ids.map(id => {
    const L = D.labels[id] || {}; const c = D.clips[id];
    return `<article class="shot" data-clip="${id}"><div class="thumb"><img loading="lazy" src="${frameUrl(id, (c.duration || 0) / 2)}" alt=""><span class="tag dur">${c.duration.toFixed(0)}s</span></div>
      <div class="meta"><div class="sid">${id}${used[id] ? ` · <span class="used">in the cut</span>` : ""}</div>
      <div class="summary">${esc(L.summary || "not labeled yet")}</div></div></article>`;
  }).join("") || `<div class="empty">No clips match.</div>`;
  bindShots();
}

/* ---------------- checks */
function renderChecks() {
  const c = D.check;
  if (!c) return `<div class="wrap empty">No sequence to check yet.</div>`;
  return `<div class="wrap"><h1 class="page-title">Checks</h1><p class="lede">From <span class="mono">storian check</span>. Errors block the sequence; warnings are editing rules the agent should fix or justify.</p>
    <dl class="kv" style="max-width:420px">${Object.entries(c.stats).map(([k, v]) => `<dt>${k.replace(/_/g, " ")}</dt><dd>${v}</dd>`).join("")}</dl>
    <h2 class="section-h">Errors (${c.errors.length})</h2><ul class="issues">${c.errors.map(e => `<li class="err">${esc(e)}</li>`).join("") || "<li>none</li>"}</ul>
    <h2 class="section-h">Warnings (${c.warnings.length})</h2><ul class="issues">${c.warnings.map(e => `<li>${esc(e)}</li>`).join("") || "<li>none</li>"}</ul></div>`;
}

function go(tab) { TAB = tab; if (location.hash.slice(1) !== tab) history.pushState(null, "", "#" + tab); closeDrawer(); render(); scrollTo(0, 0); }
document.querySelectorAll("#nav button").forEach(b => b.addEventListener("click", () => go(b.dataset.tab)));
addEventListener("hashchange", () => { const h = location.hash.slice(1); if (TABS.includes(h) && h !== TAB) go(h); });
addEventListener("popstate", () => { const h = location.hash.slice(1) || "board"; if (TABS.includes(h) && h !== TAB) go(h); });
load().then(() => {
  if (D.hosted && "serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
  poll();
});
</script>
</body>
</html>
